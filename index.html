<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SStoreEGP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f3f3f3;
}

/* ===== HEADER ===== */
header {
  background: #111;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 14px;
}

/* ===== PRODUCTOS ===== */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  padding: 30px;
}

.producto {
  background: white;
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.producto img {
  width: 100%;
  border-radius: 10px;
}

.producto h3 {
  margin: 12px 0 5px;
}

.producto p {
  margin: 4px 0;
}

.precio-tachado {
  color: red;
  text-decoration: line-through;
  font-weight: bold;
}

.precio-oferta {
  font-weight: bold;
  color: black;
}

/* ===== BLOQUE TALLA + BOTÓN (SIMETRÍA FIX DESKTOP) ===== */
.bloque-compra {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

select {
  padding: 10px;
  border-radius: 8px;
  font-size: 15px;
}

button {
  background: #1f4be3;
  color: white;
  border: none;
  padding: 12px;
  font-size: 15px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* ===== CARRITO ===== */
#carrito {
  position: fixed;
  top: 0;
  right: -360px;
  width: 360px;
  height: 100%;
  background: white;
  box-shadow: -5px 0 15px rgba(0,0,0,0.2);
  padding: 20px;
  transition: right 0.3s ease;
  z-index: 1000;
}

#carrito.abierto {
  right: 0;
}

.carrito-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cerrar {
  cursor: pointer;
  font-size: 22px;
}

.item-carrito {
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.item-carrito span {
  font-size: 14px;
}

.eliminar {
  cursor: pointer;
  font-weight: bold;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== FOOTER ===== */
footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 25px;
}

footer a {
  color: white;
  text-decoration: underline;
  margin: 0 10px;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .productos {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  @sstoreegp · dudas: sstoreegp@gmail.com
</header>

<section class="productos">

<!-- EJEMPLOS (mantén todos los tuyos igual, solo muestro algunos) -->

<div class="producto" data-precio="17">
  <img src="south.jpg">
  <h3>South Things</h3>
  <p>Stranger Things x South Park</p>
  <p><strong>17 €</strong></p>
  <div class="bloque-compra">
    <select>
      <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
    </select>
    <button onclick="agregar(this)">Añadir</button>
  </div>
</div>

<div class="producto" data-precio="14" data-oferta="true">
  <img src="raro.jpg">
  <h3>Raro de cojones</h3>
  <p>Diseño exclusivo</p>
  <p>
    <span class="precio-tachado">18 €</span>
    <span class="precio-oferta"> 14 €</span>
  </p>
  <div class="bloque-compra">
    <select>
      <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
    </select>
    <button onclick="agregar(this, true)">Añadir</button>
  </div>
</div>

<!-- TUS DEMÁS PRODUCTOS VAN AQUÍ SIN CAMBIAR NADA -->

</section>

<!-- ===== CARRITO ===== -->
<div id="carrito">
  <div class="carrito-header">
    <h3>Carrito</h3>
    <span class="cerrar" onclick="toggleCarrito()">✕</span>
  </div>
  <div id="lista"></div>
  <p id="total"></p>
</div>

<footer>
  <p>Envíos a casi todo el mundo</p>
  <a href="#">Terms of Service</a>
  <a href="#">Privacy Policy</a>
</footer>

<script>
let carrito = [];

function toggleCarrito() {
  document.getElementById("carrito").classList.toggle("abierto");
}

function agregar(btn, oferta = false) {
  const prod = btn.closest(".producto");
  const nombre = prod.querySelector("h3").innerText;
  const talla = prod.querySelector("select").value;
  let precio = oferta ? 14 : parseFloat(prod.dataset.precio);

  carrito.push({ nombre, talla, precio, oferta });
  renderCarrito();
  document.getElementById("carrito").classList.add("abierto");
}

function eliminar(i) {
  carrito.splice(i, 1);
  renderCarrito();
}

function renderCarrito() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  let total = 0;

  carrito.forEach((item, i) => {
    total += item.precio;
    lista.innerHTML += `
      <div class="item-carrito">
        <span>
          ${item.nombre} (${item.talla})<br>
          ${item.oferta ? "<span class='precio-tachado'>18 €</span> <strong>14 €</strong>" : item.precio + " €"}
        </span>
        <span class="eliminar" onclick="eliminar(${i})">✕</span>
      </div>
    `;
  });

  document.getElementById("total").innerHTML = "<strong>Total:</strong> " + total + " €";
}
</script>

</body>
</html>
