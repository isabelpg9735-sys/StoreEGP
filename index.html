<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<script src="https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUliw1XXDK_UuvVd0lrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR"></script>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#111;color:#fff;text-align:center;padding:20px}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:16px}

.producto{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column}
.producto img{width:100%;border-radius:10px}
.producto h3{margin:6px 0}
.producto p{margin:4px 0;font-size:14px}

select,button,input{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%}
button{background:#1e4ddb;color:#fff;border:none;cursor:pointer}

#carritoBtn{
 position:fixed;bottom:20px;right:20px;
 width:60px;height:60px;border-radius:50%;
 background:#2ecc71;font-size:24px;border:none
}

#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:#fff;width:22px;height:22px;
 border-radius:50%;display:none;align-items:center;justify-content:center
}

#carrito{
 position:fixed;top:0;right:-100%;
 width:100%;max-width:420px;height:100%;
 background:#fff;padding:20px;
 transition:.3s;overflow:auto;z-index:999
}
#carrito.abierto{right:0}

.item{
 display:grid;
 grid-template-columns:1fr auto;
 gap:6px;
 padding:8px 0;
 border-bottom:1px solid #ddd;
 font-size:14px
}

.item small{color:#555}
.item button{
 background:#e74c3c;
 padding:4px 8px;
 font-size:12px;
 border-radius:6px
}

.descuento{color:red;font-weight:bold}
#paypal-container{margin-top:15px}

footer{text-align:center;padding:20px}
footer a{margin:0 6px;color:#1e4ddb;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<p>Aquí encuentras lo que no sabías que buscabas</p>
</header>

<section class="productos" id="productos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒
<div id="badge">0</div>
</button>

<div id="carrito">
<h2>Carrito</h2>
<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<input placeholder="Nombre">
<input placeholder="Email">
<input placeholder="Dirección">
<input placeholder="Ciudad">
<input placeholder="Código Postal">

<p><b>Envío:</b> España peninsular · 0€</p>

<div id="paypal-container"></div>
</div>

<footer>
<a>Terms</a> · <a>Privacy</a> · <a>Devoluciones</a> · <a>Envíos</a>
</footer>

<script>
const productos=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL"},
 {n:"Fortachón",p:13,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete things"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Borracho"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];

const carrito=[];
let paypalRendered=false;

const cont=document.getElementById("productos");
productos.forEach(p=>{
 cont.innerHTML+=`
 <div class="producto">
  <img src="${p.img}">
  <h3>${p.n}</h3>
  <p>${p.d}</p>
  <b>${p.p}€</b>
  <select id="talla-${p.n}">
   <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
  </select>
  <button onclick="add('${p.n}',${p.p})">Añadir</button>
 </div>`;
});

function add(n,p){
 const talla=document.getElementById("talla-"+n).value;
 carrito.push({n,p,talla});
 actualizar();
 abrirCarrito();
}

function actualizar(){
 const items=document.getElementById("items");
 items.innerHTML="";
 let total=0;

 carrito.forEach((i,idx)=>{
  total+=i.p;
  items.innerHTML+=`
   <div class="item">
    <div>
     <b>${i.n}</b><br>
     <small>Talla: ${i.talla} · ${i.p}€</small>
    </div>
    <button onclick="carrito.splice(${idx},1);actualizar()">✖</button>
   </div>`;
 });

 let descuento=carrito.length>1?(carrito.length-1)*2:0;
 total-=descuento;

 document.getElementById("resumen").innerHTML=
 `Subtotal: ${total+descuento}€<br>
 <span class="descuento">Descuento: -${descuento}€</span><br>
 <b>Total: ${total}€</b>`;

 const badge=document.getElementById("badge");
 badge.style.display=carrito.length?"flex":"none";
 badge.textContent=carrito.length;

 renderPaypal(total);
}

function renderPaypal(total){
 if(total<=0)return;
 document.getElementById("paypal-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:total.toFixed(2)}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>{
   alert("Pago completado");
   carrito.length=0;
   actualizar();
  })
 }).render("#paypal-container");
}

function abrirCarrito(){
 document.getElementById("carrito").classList.add("abierto");
}
</script>

</body>
</html>
