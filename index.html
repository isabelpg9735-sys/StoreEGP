<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Online</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #111; color: white; padding: 20px; text-align: center; }
    .productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
    .producto { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .producto img { width: 100%; border-radius: 6px; }
    .producto h3 { margin: 10px 0 5px; }
    .producto p { margin: 5px 0; }
    button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    footer { text-align: center; padding: 15px; background: #222; color: white; }
  </style>
</head>
<body>
  <header>
    <h1>Mi Tienda Online</h1>
    <p>Vende tus productos fácilmente</p>
  </header>

  <section class="productos">
    <div class="producto">
      <img src="https://via.placeholder.com/300" alt="Producto 1">
      <h3>Producto 1</h3>
      <p>Precio: 20 €</p>
      <button onclick="comprar('Producto 1', 20)">Comprar</button>
    </div>

    <div class="producto">
      <img src="https://via.placeholder.com/300" alt="Producto 2">
      <h3>Producto 2</h3>
      <p>Precio: 35 €</p>
      <button onclick="comprar('Producto 2', 35)">Comprar</button>
    </div>
  </section>

  <footer>
    <p>© 2026 Mi Tienda</p>
  </footer>

  <script>
    function comprar(nombre, precio) {
      alert(`Has seleccionado ${nombre} por ${precio} €`);
    }
  </script>
</body>
</html>
