<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<style>
:root{
 --dark:#0f0f0f;
 --bg:#f3f3f3;
 --card:#ffffff;
 --primary:#1d4ed8;
 --accent:#22c55e;
 --danger:#ef4444;
 --radius:16px;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial, Helvetica, sans-serif;
 background:var(--bg);
}

/* HEADER */
header{
 background:linear-gradient(135deg,#000,#222);
 color:white;
 padding:50px 20px;
 text-align:center;
}
header h1{margin:0;font-size:40px}
header p{opacity:.85;margin-top:6px}
header input{
 margin-top:25px;
 padding:14px 18px;
 width:100%;
 max-width:450px;
 border-radius:999px;
 border:none;
 font-size:16px;
}

/* GRID */
.productos{
 max-width:1500px;
 margin:auto;
 padding:50px 25px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
 gap:35px;
}

/* CARD */
.producto{
 background:var(--card);
 border-radius:var(--radius);
 box-shadow:0 15px 35px rgba(0,0,0,.1);
 display:flex;
 flex-direction:column;
 overflow:hidden;
 transition:.35s;
}
.producto:hover{
 transform:translateY(-10px);
 box-shadow:0 30px 60px rgba(0,0,0,.2);
}

.producto img{
 width:100%;
 height:260px;
 object-fit:contain;
 background:#fafafa;
 padding:20px;
}

.info{
 padding:22px;
 display:flex;
 flex-direction:column;
 flex:1;
}

.badge{
 background:gold;
 padding:6px 12px;
 border-radius:999px;
 font-size:12px;
 width:max-content;
 margin-bottom:10px;
}

.info h3{margin:0 0 6px;font-size:20px}
.descripcion{font-size:14px;opacity:.8;margin-bottom:10px}
.precio{font-size:22px;font-weight:700;margin-bottom:12px}

select{
 padding:10px;
 border-radius:8px;
 margin-bottom:10px;
}

button{
 padding:14px;
 border:none;
 border-radius:12px;
 background:var(--primary);
 color:white;
 font-size:16px;
 cursor:pointer;
}
button:hover{opacity:.9}

/* CARRITO BOTÓN */
#btnCarrito{
 position:fixed;
 bottom:25px;
 right:25px;
 width:70px;
 height:70px;
 border-radius:50%;
 background:var(--accent);
 color:white;
 font-size:30px;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 z-index:1000;
}

/* OVERLAY */
#overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 display:none;
 z-index:998;
}

/* CARRITO */
#carrito{
 position:fixed;
 right:-420px;
 top:0;
 width:420px;
 height:100%;
 background:white;
 padding:30px;
 z-index:999;
 display:flex;
 flex-direction:column;
 transition:.4s;
}
#carrito.abierto{right:0}
#overlay.activo{display:block}

#lista{
 flex:1;
 overflow:auto;
 margin:20px 0;
}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
 font-size:14px;
}

.item button{
 padding:6px 10px;
 font-size:14px;
 margin-left:5px;
}

.total{
 font-size:20px;
 font-weight:bold;
 margin-top:10px;
}

.envio{font-size:14px;margin-top:6px}

.finalizar{
 margin-top:20px;
 background:var(--primary);
 padding:18px;
}

/* MOBILE */
@media(max-width:650px){
 #carrito{width:100%}
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<p>Ropa con personalidad propia</p>
<input placeholder="Buscar productos..." oninput="buscar(this.value)">
</header>

<div id="btnCarrito" onclick="abrir()">🛒</div>
<div id="overlay" onclick="cerrar()"></div>

<section class="productos">

<!-- PRODUCTOS (14) -->
<script>
const productos=[
 {n:"South Things",p:17,img:"camiseta-south-things.jpg"},
 {n:"Jhon Pork",p:16,img:"camiseta-pork.jpg"},
 {n:"Steve Harrington",p:16,img:"camiseta-steve.jpg"},
 {n:"Dais Asco",p:16,img:"camiseta-asco.jpg"},
 {n:"Drunk",p:15,img:"camiseta-drunk.jpg"},
 {n:"Fuerte",p:10,img:"camiseta-fuerte.jpg"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg"},
 {n:"Razón la que tengo",p:15,img:"camiseta-razon.jpg"},
 {n:"Ollita",p:15,img:"camiseta-olla.jpg"},
 {n:"(C)Rock",p:15,img:"camiseta-crock.jpg"},
 {n:"¿Cervecita?",p:15,img:"camiseta-cerveza.jpg"},
 {n:"Alejense Gordas",p:12,img:"camiseta-clash.jpg"},
 {n:"Kill humans 🙏",p:12,img:"camiseta-future.jpg"},
 {n:"Spiderman",p:10,img:"camiseta-spiderman.jpg"}
];

document.write(productos.map((p,i)=>`
<div class="producto" data-nombre="${p.n}" data-precio="${p.p}">
<img src="${p.img}">
<div class="info">
${i===7?'<span class="badge">DESTACADO</span>':''}
<h3>${p.n}</h3>
<p class="descripcion">Camiseta premium edición limitada</p>
<div class="precio">${p.p} €</div>
<select>
 <option>Talla S</option>
 <option>Talla M</option>
 <option>Talla L</option>
 <option>Talla XL</option>
</select>
<button onclick="add(this)">Añadir al carrito</button>
</div>
</div>`).join(""));
</script>

</section>

<div id="carrito">
<h2>Tu carrito</h2>
<div id="lista"></div>
<div class="envio">Envío: <span id="envio">0</span> €</div>
<div class="total">Total: <span id="total">0</span> €</div>
<button class="finalizar">Finalizar compra</button>
</div>

<script>
let carrito=JSON.parse(localStorage.getItem("carrito"))||[];
const lista=document.getElementById("lista");
const total=document.getElementById("total");
const envio=document.getElementById("envio");
const carritoDiv=document.getElementById("carrito");
const overlay=document.getElementById("overlay");

function add(btn){
 const p=btn.closest(".producto");
 const n=p.dataset.nombre;
 const pr=+p.dataset.precio;
 const it=carrito.find(i=>i.n===n);
 it?it.c++:carrito.push({n,pr,c:1});
 save();abrir();
}

function quitar(i){carrito[i].c--;if(carrito[i].c<=0)carrito.splice(i,1);save();}
function eliminar(i){carrito.splice(i,1);save();}

function save(){localStorage.setItem("carrito",JSON.stringify(carrito));render();}

function render(){
 lista.innerHTML="";
 let t=0;
 carrito.forEach((i,idx)=>{
  t+=i.pr*i.c;
  lista.innerHTML+=`
  <div class="item">
   <span>${i.n} x${i.c}</span>
   <span>
    <button onclick="quitar(${idx})">➖</button>
    <button onclick="eliminar(${idx})">❌</button>
    ${i.pr*i.c}€
   </span>
  </div>`;
 });
 let env=t>50?0:5;
 envio.textContent=env;
 total.textContent=t+env;
}

function abrir(){carritoDiv.classList.add("abierto");overlay.classList.add("activo")}
function cerrar(){carritoDiv.classList.remove("abierto");overlay.classList.remove("activo")}

function buscar(t){
 t=t.toLowerCase();
 document.querySelectorAll(".producto").forEach(p=>{
  p.style.display=p.dataset.nombre.toLowerCase().includes(t)?"flex":"none";
 });
}

render();
</script>

</body>
</html>
