<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #000, #222);
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header input {
  margin-top: 15px;
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

/* GRID */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  padding: 30px;
  max-width: 1400px;
  margin: auto;
}

/* CARD */
.producto {
  background: white;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: fadeUp 0.4s ease;
}

@keyframes fadeUp {
  from {opacity:0; transform:translateY(20px)}
  to {opacity:1; transform:translateY(0)}
}

.producto.destacado {
  border: 3px solid gold;
}

.producto img {
  width: 100%;
  height: 260px;
  object-fit: contain;
  padding: 10px;
}

.producto h3 {
  margin: 10px;
}

.producto p {
  margin: 0 10px 10px;
  font-weight: bold;
}

.producto button {
  margin: auto 10px 15px;
  padding: 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: #007bff;
  color: white;
}

.producto button:hover {
  background: #0056b3;
}

.producto.placeholder {
  background: #eee;
  border: 2px dashed #bbb;
}

.producto.placeholder button {
  background: #aaa;
  cursor: not-allowed;
}

/* CARRITO */
#carrito {
  position: fixed;
  top: 0;
  right: -100%;
  width: 320px;
  height: 100%;
  background: white;
  box-shadow: -4px 0 15px rgba(0,0,0,0.2);
  transition: right 0.3s;
  padding: 20px;
  z-index: 999;
}

#carrito.abierto {
  right: 0;
}

#carrito h2 {
  margin-top: 0;
}

#lista-carrito li {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

/* BOTÓN CARRITO */
#btnCarrito {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #28a745;
  color: white;
  padding: 12px 16px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 1000;
}

/* FOOTER */
footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 15px;
}

/* MOBILE */
@media(max-width:600px){
  #carrito { width: 100%; }
  header input { width: 90%; }
}
</style>
</head>

<body>

<header>
  <h1>Store EGP</h1>
  <p>Encuentra los mejores productos aquí</p>
  <input type="text" placeholder="Buscar..." onkeyup="buscar(this.value)">
</header>

<div id="btnCarrito" onclick="toggleCarrito()">🛒</div>

<section class="productos" id="productos">

  <!-- DESTACADOS -->
  <div class="producto destacado" data-nombre="Alejense Gordas" data-precio="12">
    <img src="camiseta-clash.jpg">
    <h3>Alejense Gordas ⭐</h3>
    <p>Precio: 12 €</p>
    <button onclick="agregar(this)">Añadir</button>
  </div>

  <div class="producto destacado" data-nombre="South Things" data-precio="17">
    <img src="camiseta-south-things.jpg">
    <h3>South Things ⭐</h3>
    <p>Precio: 17 €</p>
    <button onclick="agregar(this)">Añadir</button>
  </div>

  <!-- NORMALES -->
  <div class="producto" data-nombre="Jhon Pork" data-precio="16">
    <img src="camiseta-pork.jpg">
    <h3>Jhon Pork</h3>
    <p>Precio: 16 €</p>
    <button onclick="agregar(this)">Añadir</button>
  </div>

  <div class="producto" data-nombre="Steve Harrington" data-precio="10">
    <img src="camiseta-steve.jpg">
    <h3>Steve Harrington</h3>
    <p>Precio: 10 €</p>
    <button onclick="agregar(this)">Añadir</button>
  </div>

  <!-- HUECOS -->
  <div class="producto placeholder"><h3>Producto nuevo</h3><button disabled>Próximamente</button></div>
  <div class="producto placeholder"><h3>Producto nuevo</h3><button disabled>Próximamente</button></div>
  <div class="producto placeholder"><h3>Producto nuevo</h3><button disabled>Próximamente</button></div>
  <div class="producto placeholder"><h3>Producto nuevo</h3><button disabled>Próximamente</button></div>

</section>

<!-- CARRITO -->
<div id="carrito">
  <h2>Carrito</h2>
  <ul id="lista-carrito"></ul>
  <p><strong>Total: <span id="total">0</span> €</strong></p>

  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <input type="hidden" name="pedido" id="pedido">
    <button type="submit">Finalizar compra</button>
  </form>
</div>

<footer>
  <p>@storeegp</p>
</footer>

<script>
let carrito = [];

function agregar(btn){
  const p = btn.parentElement;
  const nombre = p.dataset.nombre;
  const precio = Number(p.dataset.precio);
  carrito.push({nombre, precio});
  actualizar();
}

function actualizar(){
  const lista = document.getElementById("lista-carrito");
  lista.innerHTML = "";
  let total = 0;
  carrito.forEach(p=>{
    total += p.precio;
    lista.innerHTML += `<li>${p.nombre}<span>${p.precio}€</span></li>`;
  });
  document.getElementById("total").innerText = total;
  document.getElementById("pedido").value = JSON.stringify(carrito);
}

function toggleCarrito(){
  document.getElementById("carrito").classList.toggle("abierto");
}

function buscar(texto){
  texto = texto.toLowerCase();
  document.querySelectorAll(".producto").forEach(p=>{
    const n = p.dataset.nombre?.toLowerCase() || "";
    p.style.display = n.includes(texto) ? "flex" : "none";
  });
}
</script>

</body>
</html>
