<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<style>
:root{
  --dark:#0f0f0f;
  --bg:#f3f3f3;
  --card:#ffffff;
  --primary:#1d4ed8;
  --accent:#22c55e;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
}

/* HEADER */
header{
  background:linear-gradient(135deg,#000,#222);
  color:white;
  padding:50px 20px;
  text-align:center;
}
header h1{margin:0;font-size:40px}
header p{opacity:.85;margin-top:6px}
header input{
  margin-top:25px;
  padding:14px 18px;
  width:100%;
  max-width:450px;
  border-radius:999px;
  border:none;
  font-size:16px;
}

/* SOCIAL */
.social{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:18px;
  align-items:center;
}
.social span{opacity:.9}
.social img{width:26px;height:26px}

/* GRID */
.productos{
  max-width:1500px;
  margin:auto;
  padding:50px 25px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:30px;
}

/* CARD */
.producto{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 15px 35px rgba(0,0,0,.1);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.producto img{
  width:100%;
  height:260px;
  object-fit:contain;
  background:#fafafa;
  padding:20px;
}
.info{
  padding:20px;
  display:flex;
  flex-direction:column;
  flex:1;
}
.info h3{margin:0 0 6px}
.descripcion{font-size:14px;opacity:.8}
.precio{font-size:20px;font-weight:700;margin:10px 0}
select,button{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
button{
  background:var(--primary);
  color:white;
  border:none;
  cursor:pointer;
}

/* CART */
#btnCarrito{
  position:fixed;
  right:25px;
  bottom:25px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
}
#carrito{
  position:fixed;
  right:-420px;
  top:0;
  width:420px;
  height:100%;
  background:white;
  padding:25px;
  transition:.4s;
  display:flex;
  flex-direction:column;
}
#carrito.abierto{right:0}

.item{font-size:14px;margin-bottom:8px}
.item button{
  background:#e11;
  margin-left:10px;
  padding:4px 8px;
}

.descuento{color:#e11;font-weight:bold;margin-top:8px}
.total{font-size:18px;font-weight:bold;margin-top:10px}

/* CHECKOUT */
#checkout{
  max-width:800px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  display:none;
}
#checkout input,#checkout select{
  width:100%;
  padding:12px;
  margin:8px 0;
}
#paypal-button-container{margin-top:15px}

footer{
  text-align:center;
  padding:40px;
  opacity:.7;
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<p>Aqui encuentras lo que no sabias que buscabas</p>
<input placeholder="Buscar productos..." oninput="buscar(this.value)">
<div class="social">
<span>@sstoreegp</span>
<img src="instagram.png">
<img src="tiktok.png">
</div>
</header>

<div id="btnCarrito" onclick="abrir()">🛒</div>
<div id="overlay" onclick="cerrar()"></div>

<section class="productos">

<!-- 14 PRODUCTOS -->
<script>
const productos=[
["South Things",17,"camiseta-south-things.jpg"],
["Jhon Pork",12,"camiseta-pork.jpg"],
["Steve Harrington",10,"camiseta-steve.jpg"],
["Dais Asco",15,"camiseta-asco.jpg"],
["Drunk",14,"camiseta-drunk.jpg"],
["Fuerte",10,"camiseta-fuerte.jpg"],
["Alejense Gordas",14,"camiseta-clash.jpg"],
["Raro",16,"camiseta-raro.jpg"],
["Pedrito",15,"camiseta-pedrito.jpg"],
["Razón",15,"camiseta-razon.jpg"],
["Ollita",12,"camiseta-olla.jpg"],
["(C)Rock",10,"camiseta-crock.jpg"],
["¿Cervecita?",12,"camiseta-cerveza.jpg"],
["Kill humans 🙏",12,"camiseta-future.jpg"]
];

document.write(productos.map(p=>`
<div class="producto" data-nombre="${p[0]}" data-precio="${p[1]}">
<img src="${p[2]}">
<div class="info">
<h3>${p[0]}</h3>
<div class="precio">${p[1]} €</div>
<select>
<option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button onclick="add(this)">Añadir al carrito</button>
</div>
</div>`).join(""));
</script>

</section>

<div id="carrito">
<h2>Carrito</h2>
<div id="lista"></div>
<div class="descuento" id="descuento"></div>
<div class="total">Total: <span id="total">0</span> €</div>
<button onclick="mostrarCheckout()">Finalizar compra</button>
</div>

<div id="checkout">
<h2>Datos de envío</h2>
<input placeholder="Nombre completo" required>
<input type="email" placeholder="Email" required>
<input placeholder="Dirección completa" required>

<select id="pais" onchange="calcular()">
<option>España</option>
<option>Alemania</option><option>Francia</option><option>Italia</option>
<option>Reino Unido</option><option>Polonia</option><option>Países Bajos</option>
<option>Grecia</option><option>Portugal</option><option>Suiza</option><option>Suecia</option>
<option>Otro país</option>
</select>

<div class="total">Total final: <span id="final">0</span> €</div>
<div id="paypal-button-container"></div>
</div>

<footer>
Envíos a casi todo el mundo
</footer>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=TU_CLIENT_ID_AQUI&currency=EUR"></script>

<script>
let carrito=JSON.parse(localStorage.getItem("carrito"))||[];

function add(btn){
 const p=btn.closest(".producto");
 carrito.push({
  n:p.dataset.nombre,
  pr:+p.dataset.precio,
  talla:p.querySelector("select").value
 });
 save(); abrir();
}

function save(){
 localStorage.setItem("carrito",JSON.stringify(carrito));
 render();
}

function render(){
 const lista=document.getElementById("lista");
 let suma=0;
 lista.innerHTML="";
 carrito.forEach((i,idx)=>{
  suma+=i.pr;
  lista.innerHTML+=`
   <div class="item">
    ${i.n} (${i.talla}) - ${i.pr}€
    <button onclick="del(${idx})">X</button>
   </div>`;
 });
 let desc=Math.max(0,(carrito.length-1)*2);
 document.getElementById("descuento").textContent=
  desc?`Descuento aplicado: -${desc} €`:"";
 document.getElementById("total").textContent=suma-desc;
 calcular();
}

function del(i){carrito.splice(i,1);save()}

function calcular(){
 let envio=5;
 const p=document.getElementById("pais").value;
 if(["Alemania","Francia","Italia","Reino Unido","Polonia","Países Bajos","Grecia","Portugal","Suiza","Suecia"].includes(p))envio=12;
 if(p==="Otro país")envio=20;
 document.getElementById("final").textContent=
  +document.getElementById("total").textContent+envio;
}

function abrir(){
 document.getElementById("carrito").classList.add("abierto");
 document.getElementById("overlay").style.display="block";
}
function cerrar(){
 document.getElementById("carrito").classList.remove("abierto");
 document.getElementById("overlay").style.display="none";
}

function mostrarCheckout(){
 document.getElementById("checkout").style.display="block";
 document.getElementById("checkout").scrollIntoView({behavior:"smooth"});
}

function buscar(t){
 t=t.toLowerCase();
 document.querySelectorAll(".producto").forEach(p=>{
  p.style.display=p.dataset.nombre.toLowerCase().includes(t)?"flex":"none";
 });
}

paypal.Buttons({
 createOrder:(d,a)=>a.order.create({
  purchase_units:[{amount:{value:document.getElementById("final").textContent}}]
 }),
 onApprove:(d,a)=>a.order.capture().then(()=>{
  alert("Pago completado");
  carrito=[];save();
 })
}).render("#paypal-button-container");

render();
</script>

</body>
</html>
