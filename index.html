<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<script src="https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUliw1XXDK_UuvVd0lrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f2f2}
header{background:#111;color:#fff;padding:20px;text-align:center}
header small{display:block;margin-top:5px;color:#ccc}
.subtitulo{font-size:14px;color:#aaa;margin-top:6px}

.productos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
 padding:20px
}
.producto{
 background:#fff;
 border-radius:12px;
 padding:15px;
 box-shadow:0 5px 15px rgba(0,0,0,.1);
 display:flex;
 flex-direction:column;
 height:100%
}
.producto img{width:100%;border-radius:10px}
.producto h3{margin:10px 0 5px;min-height:48px}
.producto p{margin:4px 0;min-height:44px}

.precio{min-height:42px}
.oferta del{color:red;margin-right:6px}

.acciones{
 margin-top:auto;
 display:flex;
 flex-direction:column;
 gap:10px
}

select,button,input{
 padding:10px;
 border-radius:8px;
 border:1px solid #ccc
}
.producto button{
 background:#1e4ddb;
 color:#fff;
 border:none;
 cursor:pointer
}

#carritoBtn{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#2ecc71;
 width:60px;
 height:60px;
 border-radius:50%;
 font-size:24px;
 border:none;
 cursor:pointer;
 z-index:999
}
#badge{
 position:absolute;
 top:-6px;
 right:-6px;
 background:red;
 color:white;
 width:22px;
 height:22px;
 border-radius:50%;
 display:none;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:12px
}

#carrito{
 position:fixed;
 top:0;
 right:-100%;
 width:100%;
 max-width:420px;
 height:100%;
 background:#fff;
 box-shadow:-5px 0 15px rgba(0,0,0,.2);
 padding:20px;
 overflow:auto;
 transition:.3s;
 z-index:1000
}
#carrito.abierto{right:0}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ddd;
 padding:10px 0
}
.item button{
 background:none;
 border:none;
 color:red;
 font-size:18px;
 cursor:pointer
}

.descuento{color:red;font-weight:bold}

footer{text-align:center;padding:20px;font-size:14px}
footer a{margin:0 10px;color:#1e4ddb;text-decoration:none}

.legal-modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:9999
}
.legal-box{
 background:#fff;
 max-width:500px;
 width:90%;
 padding:20px;
 border-radius:12px
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<div class="subtitulo">Aquí encuentras lo que no sabías que buscabas</div>
<small>@sstoreegp · dudas: sstoreegp@gmail.com</small>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒
<div id="badge">0</div>
</button>

<div id="carrito">
<span class="cerrar" onclick="cerrarCarrito()">✖</span>
<h2>Carrito</h2>
<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<input id="inputNombre" placeholder="Nombre completo">
<input id="inputEmail" placeholder="Email de confirmación">
<input id="inputDireccion" placeholder="Dirección">
<input id="inputCP" placeholder="Código Postal">
<input id="inputCiudad" placeholder="Ciudad">

<p><b>Envío: 0€ (prueba)</b></p>

<div id="paypal-button-container"></div>
</div>

<footer>
<a href="#" onclick="abrirLegal('terms')">Terms</a>
<a href="#" onclick="abrirLegal('privacy')">Privacy</a>
<a href="#" onclick="abrirLegal('returns')">Devoluciones</a>
<a href="#" onclick="abrirLegal('shipping')">Envíos</a>
</footer>

<div class="legal-modal" id="legalModal">
<div class="legal-box">
<h2 id="legalTitulo"></h2>
<p id="legalTexto"></p>
<button onclick="cerrarLegal()">Cerrar</button>
</div>
</div>

<script>
emailjs.init("WLyVJyhY2lgWl421L");

const productos=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido te pide comprarla",oferta:"<span class='oferta'><del>15€</del> AHORA 1€</span>"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL YA"},
 {n:"Fortachón",p:13,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete rarete",oferta:"<span class='oferta'><del>25€</del> AHORA 18€</span>"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"jaja 😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Diseño rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Borracho"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];

const carrito=[];

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(pr=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${pr.img}">
   <h3>${pr.n}</h3>
   <p>${pr.d}</p>
   <div class="precio">${pr.oferta?pr.oferta:`<b>${pr.p} €</b>`}</div>
   <div class="acciones">
    <select><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
    <button onclick="add('${pr.n}',${pr.p},this)">Añadir</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,btn){
 carrito.push({n,p,talla:btn.previousElementSibling.value});
 actualizarTotales();
 abrirCarrito();
}

function actualizarTotales(){
 const div=document.getElementById("items");
 div.innerHTML="";
 let total=0;
 carrito.forEach((it,i)=>{
  total+=it.p;
  div.innerHTML+=`<div class="item"><span>${it.n} (${it.talla}) - ${it.p}€</span><button onclick="quitar(${i})">✖</button></div>`;
 });

 document.getElementById("badge").style.display=carrito.length?"flex":"none";
 document.getElementById("badge").textContent=carrito.length;

 let envioVisible=0;
 let totalPaypal=Math.max(0.01,total+envioVisible);

 document.getElementById("resumen").innerHTML=
 `Productos: ${total}€<br>Envío: ${envioVisible}€<br><b>Total: ${total}€</b>`;

 document.getElementById("paypal-button-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:totalPaypal.toFixed(2)}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(det=>enviarEmails(det,total))
 }).render("#paypal-button-container");
}

function enviarEmails(details,total){
 emailjs.send("service_qltdw7m","template_y9fr06m",{
  to_name:inputNombre.value,
  to_email:inputEmail.value,
  message:carrito.map(i=>`${i.n} (${i.talla})`).join("\n"),
  total_price:total+"€",
  address:inputDireccion.value
 });
 alert("Pedido confirmado");
 carrito.length=0;
 actualizarTotales();
 cerrarCarrito();
}

function abrirLegal(t){
 const T=legalTitulo, P=legalTexto;
 if(t==="returns") P.textContent="Si el producto no gusta o no es lo esperado, puede ser devuelto en 14 días si no ha sido usado ni lavado. El envío corre a cargo del comprador. El dinero se reembolsa tras comprobar el estado.";
 else if(t==="shipping") P.textContent="Actualmente solo envío a España peninsular.";
 else if(t==="terms") P.textContent="Condiciones de venta.";
 else P.textContent="Uso de datos.";
 legalModal.style.display="flex";
}
function cerrarLegal(){legalModal.style.display="none"}
function abrirCarrito(){carrito.classList.add("abierto")}
function cerrarCarrito(){carrito.classList.remove("abierto")}
function quitar(i){carrito.splice(i,1);actualizarTotales()}
</script>

</body>
</html>
