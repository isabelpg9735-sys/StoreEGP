<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUIiw1XXDK_UuvVd0IrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR"></script>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
 emailjs.init("WLyVJyhY2lgWl421L");
})();
</script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f2}

header{background:#111;color:#fff;padding:20px;text-align:center}
.subtitulo{font-size:14px;color:#aaa;margin-top:6px}

.productos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;padding:20px
}
.producto{
 background:#fff;border-radius:12px;padding:15px;
 box-shadow:0 5px 15px rgba(0,0,0,.1);
 display:flex;flex-direction:column
}
.producto img{width:100%;border-radius:10px}
.precio{margin:8px 0}
.oferta del{color:red;margin-right:6px}
.acciones{margin-top:auto;display:flex;flex-direction:column;gap:8px}
select,button,input{
 padding:10px;border-radius:8px;border:1px solid #ccc;width:100%
}
.producto button{
 background:#1e4ddb;color:#fff;border:none;cursor:pointer
}

#carritoBtn{
 position:fixed;bottom:20px;right:20px;
 background:#2ecc71;width:60px;height:60px;
 border-radius:50%;font-size:24px;border:none;cursor:pointer
}
#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:#fff;width:22px;height:22px;
 border-radius:50%;display:none;
 align-items:center;justify-content:center
}

#carrito{
 position:fixed;top:0;right:-100%;
 width:100%;max-width:420px;height:100%;
 background:#fff;padding:20px;
 box-shadow:-5px 0 15px rgba(0,0,0,.2);
 overflow:auto;transition:.3s
}
#carrito.abierto{right:0}
.cerrar{float:right;font-size:22px;cursor:pointer}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid #ddd;
 gap:10px;
}
.item-info{flex:1}
.item-controls{
 display:flex;
 gap:6px;
}
.item-controls button{
 width:32px;height:32px;
 display:flex;align-items:center;justify-content:center;
 background:#f5f5f5;border:1px solid #ccc;
 border-radius:6px;font-size:16px;cursor:pointer
}

.descuento{color:red;font-weight:bold}

.form-envio{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:10px;
}

footer{text-align:center;padding:20px;font-size:14px}
footer a{margin:0 8px;color:#1e4ddb;cursor:pointer}

.legal-modal{
 position:fixed;inset:0;
 background:rgba(0,0,0,.6);
 display:none;align-items:center;justify-content:center
}
.legal-box{
 background:#fff;padding:20px;border-radius:12px;max-width:500px;width:90%
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<div class="subtitulo">Aquí encuentras lo que no sabías que necesitabas</div>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒<div id="badge">0</div></button>

<div id="carrito">
<span class="cerrar" onclick="cerrarCarrito()">✖</span>
<h2>Carrito</h2>
<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<div class="form-envio">
 <input id="nombre" placeholder="Nombre completo">
 <input id="email" placeholder="Correo electrónico">
 <input id="direccion" placeholder="Dirección">
 <input id="cp" placeholder="Código postal">
 <input id="ciudad" placeholder="Ciudad">
</div>

<div id="paypal-button-container" style="margin-top:15px"></div>
</div>

<footer>
<a onclick="abrirLegal('envio')">Envío</a>
<a onclick="abrirLegal('devoluciones')">Devoluciones</a>
<a onclick="abrirLegal('terms')">Términos</a>
<a onclick="abrirLegal('privacy')">Privacidad</a>
</footer>

<div class="legal-modal" id="legalModal">
<div class="legal-box">
<h3 id="legalTitulo"></h3>
<p id="legalTexto"></p>
<button onclick="cerrarLegal()">Cerrar</button>
</div>
</div>

<script>
const productos=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido lo sabe"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things vibes"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL"},
 {n:"Fortachón",p:10,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete things"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"jaja 😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Una más"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];

const carrito={};

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(pr=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${pr.img}">
   <h3>${pr.n}</h3>
   <p>${pr.d}</p>
   <div class="precio"><b>${pr.p}€</b></div>
   <div class="acciones">
    <select><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
    <button onclick="add('${pr.n}',${pr.p},this)">Añadir</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,btn){
 const talla=btn.previousElementSibling.value;
 const key=n+"_"+talla;
 if(!carrito[key]) carrito[key]={n,p,talla,c:0};
 carrito[key].c++;
 abrirCarrito();
 actualizar();
}

function restar(k){
 if(carrito[k]){
  carrito[k].c--;
  if(carrito[k].c<=0) delete carrito[k];
  actualizar();
 }
}

function eliminar(k){delete carrito[k];actualizar();}

function actualizar(){
 const div=document.getElementById("items");
 div.innerHTML="";
 let total=0, unidades=0;

 Object.entries(carrito).forEach(([k,it])=>{
  total+=it.p*it.c;unidades+=it.c;
  div.innerHTML+=`
  <div class="item">
   <div class="item-info">${it.n} (${it.talla}) x${it.c} – ${it.p*it.c}€</div>
   <div class="item-controls">
    <button onclick="restar('${k}')">−</button>
    <button onclick="eliminar('${k}')">✕</button>
   </div>
  </div>`;
 });

 document.getElementById("badge").style.display=unidades?"flex":"none";
 document.getElementById("badge").textContent=unidades;

 let descuento=unidades>1?(unidades-1)*2:0;
 let final=total-descuento;

 document.getElementById("resumen").innerHTML=
 `Productos: ${total}€<br>
 <span class="descuento">Descuento: -${descuento}€</span><br>
 <b>Total: ${final}€</b>`;

 document.getElementById("paypal-button-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{value:final.toFixed(2)}}]}),
  onApprove:(d,a)=>a.order.capture().then(()=>{
   enviarEmail(final);
   alert("¡Pago realizado! Hemos enviado un email con tu pedido.");
  })
 }).render("#paypal-button-container");
}

function enviarEmail(total){
 let lista="";
 Object.values(carrito).forEach(it=>{
  lista+=`${it.n} (${it.talla}) x${it.c} – ${it.p*it.c}€\n`;
 });

 emailjs.send("service_ko8t2at","template_y9fr06m",{
  cliente:document.getElementById("nombre").value,
  email:document.getElementById("email").value,
  pedido:lista,
  total:total+"€"
 });
}

function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}

function abrirLegal(t){
 const h=document.getElementById("legalTitulo");
 const p=document.getElementById("legalTexto");
 if(t==="envio") p.textContent="Solo España peninsular. Entrega ~15 días.";
 if(t==="devoluciones") p.textContent="14 días si no está usada ni lavada.";
 if(t==="terms") p.textContent="Al comprar aceptas las condiciones.";
 if(t==="privacy") p.textContent="Tus datos no se comparten con terceros.";
 h.textContent=t.toUpperCase();
 document.getElementById("legalModal").style.display="flex";
}
function cerrarLegal(){document.getElementById("legalModal").style.display="none"}
</script>

</body>
</html>
