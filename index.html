<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP Profesional</title>

<style>
:root{
  --dark:#0f0f0f;
  --bg:#f3f3f3;
  --card:#ffffff;
  --primary:#1d4ed8;
  --accent:#22c55e;
  --radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.15);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}

/* HEADER */
header{
  background:linear-gradient(135deg,#000,#222);
  color:white;
  padding:50px 20px;
  text-align:center;
}
header h1{margin-bottom:6px;font-size:40px;}
header p{opacity:.85;margin-bottom:20px;}
header input{
  width:100%;max-width:450px;padding:14px 18px;border-radius:999px;border:none;font-size:16px;
}

/* PRODUCT GRID */
.productos{
  max-width:1500px;margin:auto;padding:50px 25px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:35px;
}

/* PRODUCT CARD */
.producto{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  transition:.35s;cursor:pointer;position:relative;
}
.producto:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.producto img{
  width:100%;height:280px;object-fit:contain;background:#fafafa;padding:25px;
  transition:.4s;
}
.producto:hover img{transform:scale(1.05);}
.info{padding:22px;display:flex;flex-direction:column;flex:1;}
.badge{
  background:gold;padding:6px 12px;border-radius:999px;font-size:12px;width:max-content;margin-bottom:10px;
}
.info h3{margin:0 0 6px;font-size:20px;}
.descripcion{font-size:14px;opacity:.8;margin-bottom:12px;}
.precio{font-size:22px;font-weight:700;margin-bottom:18px;}
.info button{
  margin-top:auto;padding:16px;border:none;border-radius:12px;background:var(--primary);
  color:white;font-size:16px;cursor:pointer;transition:.3s;
}
.info button:hover{opacity:.9; transform:scale(1.05);}

/* CARRITO LOGO */
#btnCarrito{
  position:fixed;bottom:25px;right:25px;width:70px;height:70px;border-radius:50%;
  background:var(--accent);color:white;font-size:30px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;z-index:1000;
  box-shadow:0 5px 20px rgba(0,0,0,.3);transition:.3s;
}
#btnCarrito:hover{transform:scale(1.1);}
#cantidadCarrito{
  position:absolute;top:-10px;right:-10px;background:red;color:white;width:22px;height:22px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;
}

/* OVERLAY */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;z-index:998;
}

/* CARRITO */
#carrito{
  position:fixed;right:-500px;top:0;width:500px;height:100%;
  background:white;padding:30px;z-index:999;display:flex;flex-direction:column;
  transition:.5s;overflow-y:auto;border-left:5px solid var(--accent);
}
#carrito.abierto{right:0;}
#lista{flex:1;margin:20px 0;}
.item{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;
}
.item img{width:50px;height:50px;object-fit:contain;border-radius:10px;margin-right:10px;}
.item span{flex:1;}
.item button{
  background:red;color:white;border:none;padding:4px 7px;border-radius:6px;cursor:pointer;
}
.total{font-size:20px;font-weight:bold;margin-bottom:20px;}
.finalizar{
  padding:18px;border:none;border-radius:14px;background:var(--primary);
  color:white;font-size:16px;cursor:pointer;
}

/* VENTANA DETALLE */
#detalle{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:340px;background:white;padding:25px;border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.3);z-index:1001;display:none;animation:fadeIn .4s;
}
#detalle h3{margin-top:0;}
#detalle button{
  margin-top:15px;padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;cursor:pointer;width:100%;
}
#detalle select{
  width:100%;padding:10px;margin-top:10px;border-radius:10px;border:1px solid #ccc;font-size:16px;
}

/* FORMULARIO CONSULTA */
#consulta{
  max-width:450px;margin:60px auto;background:white;padding:25px;border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.2);
}
#consulta input,#consulta textarea{
  width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:12px;font-size:15px;
}
#consulta button{
  width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;cursor:pointer;
  font-size:16px;margin-top:10px;transition:.3s;
}
#consulta button:hover{transform:scale(1.03);}

/* ANIMACIONES */
@keyframes fadeIn{
  from{opacity:0; transform:translate(-50%,-48%) scale(0.95);}
  to{opacity:1; transform:translate(-50%,-50%) scale(1);}
}

/* MOBILE */
@media(max-width:700px){
  #carrito{width:100%;}
  #detalle{width:90%;}
  .productos{padding:30px 15px; gap:20px;}
}
</style>
</head>
<body>

<header>
<h1>Store EGP</h1>
<p>Ropa con personalidad propia</p>
<input placeholder="Buscar productos..." oninput="buscar(this.value)">
</header>

<div id="btnCarrito" onclick="abrir()">
  🛒<span id="cantidadCarrito">0</span>
</div>
<div id="overlay" onclick="cerrar()"></div>

<section class="productos">

<!-- PRODUCTOS: los 9 originales -->
<!-- Ejemplo de un producto -->
<div class="producto" data-nombre="Alejense Gordas" data-precio="12" data-desc="Lo necesario para que no se acerquen 🔥" data-img="camiseta-clash.jpg">
<img src="camiseta-clash.jpg">
<div class="info">
<span class="badge">DESTACADO</span>
<h3>Alejense Gordas</h3>
<p class="descripcion">Lo necesario para que no se acerquen 🔥</p>
<div class="precio">12 €</div>
<button onclick="abrirDetalle(this)">Ver detalles</button>
</div>
</div>

<!-- Repite los 8 restantes igual que antes, cambiando datos -->

</section>

<!-- VENTANA DETALLE -->
<div id="detalle">
<h3 id="dNombre"></h3>
<p id="dDesc"></p>
<div class="precio" id="dPrecio"></div>
<label for="talla">Selecciona talla:</label>
<select id="talla">
<option value="XS">XS</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
</select>
<button onclick="addDetalle()">Añadir al carrito</button>
</div>

<!-- CARRITO -->
<div id="carrito">
<h2>Tu carrito</h2>
<div id="lista"></div>
<div class="total">Total: <span id="total">0</span> €</div>

<form action="https://formspree.io/f/xbddlgvr" method="POST">
<input type="hidden" name="pedido" id="pedido">
<button class="finalizar">Finalizar compra</button>
</form>
</div>

<!-- FORMULARIO CONSULTA -->
<form id="consulta" action="https://formspree.io/f/xbddlgvr" method="POST">
<h3>Consulta / Dudas</h3>
<input type="text" name="name" placeholder="Tu nombre" required>
<input type="email" name="email" placeholder="Tu correo" required>
<textarea name="message" placeholder="Escribe tu consulta" required></textarea>
<button type="submit">Enviar</button>
</form>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito"))||[];
let currentProducto=null;

const lista=document.getElementById("lista");
const total=document.getElementById("total");
const pedido=document.getElementById("pedido");
const carritoDiv=document.getElementById("carrito");
const overlay=document.getElementById("overlay");
const cantidadCarrito=document.getElementById("cantidadCarrito");

function abrir(){carritoDiv.classList.add("abierto"); overlay.classList.add("activo");}
function cerrar(){carritoDiv.classList.remove("abierto"); overlay.classList.remove("activo"); closeDetalle();}
function save(){localStorage.setItem("carrito",JSON.stringify(carrito)); render();}
function render(){
 lista.innerHTML="";
 let t=0;
 carrito.forEach((i,idx)=>{
  t+=i.pr*i.c;
  lista.innerHTML+=`
   <div class="item">
    <img src="${i.img}" alt="${i.n}"/>
    <span>${i.n} (${i.talla}) x${i.c}</span>
    <span>${i.pr*i.c}€</span>
    <button onclick="eliminar(${idx})">X</button>
   </div>`;
 });
 total.textContent=t;
 pedido.value=JSON.stringify(carrito);
 cantidadCarrito.textContent=carrito.length;
}
function eliminar(idx){carrito.splice(idx,1); save();}

// BUSCAR
function buscar(t){
  t=t.toLowerCase();
  document.querySelectorAll(".producto").forEach(p=>{
    const n=p.dataset.nombre.toLowerCase();
    p.style.display=n.includes(t)?"flex":"none";
  });
}

// DETALLE
function abrirDetalle(btn){
  const p=btn.closest(".producto");
  currentProducto = p;
  document.getElementById("dNombre").textContent=p.dataset.nombre;
  document.getElementById("dDesc").textContent=p.dataset.desc;
  document.getElementById("dPrecio").textContent=p.dataset.precio + " €";
  document.getElementById("detalle").style.display="block";
  overlay.classList.add("activo");
}
function closeDetalle(){document.getElementById("detalle").style.display="none";}

// AÑADIR AL CARRITO
function addDetalle(){
  const n=currentProducto.dataset.nombre;
  const pr=+currentProducto.dataset.precio;
  const img=currentProducto.dataset.img;
  const talla=document.getElementById("talla").value;
  carrito.push({n,pr,talla,c:1,img});
  save();
  closeDetalle();
  abrir();
}

render();
</script>
</body>
</html>
