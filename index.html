<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<style>
:root{
  --dark:#0f0f0f;
  --bg:#f3f3f3;
  --card:#ffffff;
  --primary:#1d4ed8;
  --accent:#22c55e;
  --radius:14px;
}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg)}
header{
  background:#111;color:#fff;padding:30px;text-align:center
}
header p{margin:8px 0 0}
.productos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
  padding:30px;
}
.producto{
  background:#fff;border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
  display:flex;flex-direction:column
}
.producto img{
  height:220px;object-fit:contain;padding:20px;background:#fafafa
}
.info{padding:16px;display:flex;flex-direction:column;flex:1}
.info h3{margin:0 0 6px}
.precio{font-weight:bold;font-size:18px}
select,button,input{
  padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:8px
}
button{background:var(--primary);color:#fff;border:none;cursor:pointer}
#btnCarrito{
  position:fixed;right:20px;bottom:20px;
  width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center
}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none
}
#carrito{
  position:fixed;right:-100%;top:0;width:100%;
  max-width:420px;height:100%;
  background:#fff;padding:20px;
  transition:.3s;overflow:auto
}
#carrito.abierto{right:0}
.item{display:flex;justify-content:space-between;margin-bottom:8px}
.total{font-weight:bold;margin-top:10px}
@media(max-width:600px){.productos{padding:15px}}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<p>Cualquier duda: sstoreegp@gmail.com</p>
<p>@sstoreegp</p>
</header>

<div id="btnCarrito" onclick="abrirCarrito()">🛒</div>
<div id="overlay" onclick="cerrarCarrito()"></div>

<section class="productos" id="productos"></section>

<div id="carrito">
<button onclick="cerrarCarrito()">❌</button>
<h2>Carrito</h2>
<div id="lista"></div>
<div id="resumen"></div>

<h3>Datos de envío</h3>
<input placeholder="Nombre completo" required>
<input placeholder="Dirección completa" required>
<select id="pais" onchange="calcular()">
  <option value="5">España</option>
  <option value="12">Europa cercana</option>
  <option value="20">Resto del mundo</option>
</select>

<div class="total" id="totalFinal"></div>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=TU_CLIENT_ID&currency=EUR"></script>
<div id="paypal-button-container"></div>
</div>

<footer style="text-align:center;padding:20px">
<p>Envíos a casi todo el mundo</p>
</footer>

<script>
const productosData=[
["Alejense Gordas",12,"camiseta-clash.jpg"],
["South Things",17,"camiseta-south-things.jpg"],
["Jhon Pork",16,"camiseta-pork.jpg"],
["Steve Harrington",16,"camiseta-steve.jpg"],
["Dais Asco",16,"camiseta-asco.jpg"],
["Drunk",15,"camiseta-drunk.jpg"],
["Fuerte",10,"camiseta-fuerte.jpg"],
["Raro",16,"camiseta-raro.jpg"],
["Pedrito",15,"camiseta-pedrito.jpg"],
["Razón",15,"camiseta-razon.jpg"],
["Olla",15,"camiseta-olla.jpg"],
["Crock",15,"camiseta-crock.jpg"],
["Cervecita",12,"camiseta-cerveza.jpg"],
["Spiderman",10,"camiseta-spiderman.jpg"]
];

let carrito=[];

const cont=document.getElementById("productos");
productosData.forEach(p=>{
  cont.innerHTML+=`
  <div class="producto">
    <img src="${p[2]}">
    <div class="info">
      <h3>${p[0]}</h3>
      <div class="precio">${p[1]} €</div>
      <select>
        <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
      </select>
      <button onclick="add('${p[0]}',${p[1]},this)">Añadir</button>
    </div>
  </div>`;
});

function add(n,pr,btn){
 const talla=btn.previousElementSibling.value;
 carrito.push({n,pr,talla});
 render();
 abrirCarrito();
}

function render(){
 const l=document.getElementById("lista");
 l.innerHTML="";
 let subtotal=0;
 carrito.forEach((i,idx)=>{
  subtotal+=i.pr;
  l.innerHTML+=`<div class="item">${i.n} (${i.talla}) <button onclick="del(${idx})">X</button></div>`;
 });
 const desc=Math.max(0,(carrito.length-1)*2);
 document.getElementById("resumen").innerHTML=
  `Subtotal: ${subtotal}€<br>Descuento: -${desc}€`;
 calcular();
}

function calcular(){
 const envio=+document.getElementById("pais").value;
 const subtotal=carrito.reduce((s,i)=>s+i.pr,0);
 const desc=Math.max(0,(carrito.length-1)*2);
 document.getElementById("totalFinal").innerText=
  `Total: ${subtotal-desc+envio} € (producto + envío)`;
}

function del(i){carrito.splice(i,1);render()}
function abrirCarrito(){
 document.getElementById("carrito").classList.add("abierto");
 document.getElementById("overlay").style.display="block";
}
function cerrarCarrito(){
 document.getElementById("carrito").classList.remove("abierto");
 document.getElementById("overlay").style.display="none";
}
</script>

</body>
</html>
