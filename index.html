<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#111;color:#fff;padding:20px;text-align:center}
header small{color:#ccc}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.producto{background:#fff;border-radius:12px;padding:15px;box-shadow:0 5px 15px rgba(0,0,0,.1);display:flex;flex-direction:column}
.producto img{width:100%;border-radius:10px}
.precio{margin:8px 0}
.oferta del{color:red;margin-right:6px}
.acciones{margin-top:auto;display:flex;flex-direction:column;gap:8px}
select,button,input{padding:10px;border-radius:8px;border:1px solid #ccc}
.producto button{background:#1e4ddb;color:#fff;border:none;cursor:pointer}

#carritoBtn{
 position:fixed;bottom:20px;right:20px;
 background:#2ecc71;width:60px;height:60px;
 border-radius:50%;font-size:24px;border:none;cursor:pointer
}
#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:#fff;width:22px;height:22px;
 border-radius:50%;display:none;align-items:center;justify-content:center
}

#carrito{
 position:fixed;top:0;right:-100%;
 width:100%;max-width:420px;height:100%;
 background:#fff;box-shadow:-5px 0 15px rgba(0,0,0,.2);
 padding:20px;overflow:auto;transition:.3s
}
#carrito.abierto{right:0}
.cerrar{float:right;font-size:22px;cursor:pointer}

.item{
 display:flex;justify-content:space-between;
 border-bottom:1px solid #ddd;padding:10px 0
}

.descuento{color:red;font-weight:bold}

footer{text-align:center;padding:20px}
footer a{margin:0 10px;color:#1e4ddb;text-decoration:none}

.btn-tarjeta{
 margin-top:10px;
 background:#000;color:#fff;
 width:100%;border:none;
 padding:12px;border-radius:8px;
 cursor:pointer
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<small>@sstoreegp · sstoreegp@gmail.com</small>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒
 <div id="badge">0</div>
</button>

<div id="carrito">
<span class="cerrar" onclick="cerrarCarrito()">✖</span>
<h2>Carrito</h2>
<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<input placeholder="Nombre completo">
<input placeholder="Dirección">
<input placeholder="Ciudad">

<select id="pais" onchange="actualizarTotales()">
 <option value="ES">España (5€)</option>
 <option value="EU">Europa (12€)</option>
 <option value="OTRO">Otro país (20€)</option>
</select>

<div id="paypal-button-container" style="margin-top:15px"></div>

<button class="btn-tarjeta" onclick="pagoTarjeta()">
 💳 Pagar con tarjeta
</button>

</div>

<footer>
<a href="#" onclick="alert('Terms of Service')">Terms of Service</a>
<a href="#" onclick="alert('Privacy Policy')">Privacy Policy</a>
</footer>

<script>
const productos=[
 {n:"Spiderman",p:10,img:"camiseta-spiderman.jpg",d:"Sentido arácnido"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger x South"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"}
];

const carrito=[];

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(pr=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${pr.img}">
   <h3>${pr.n}</h3>
   <p>${pr.d}</p>
   <div class="precio"><b>${pr.p}€</b></div>
   <div class="acciones">
    <select><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
    <button onclick="add('${pr.n}',${pr.p},this)">Añadir</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,btn){
 carrito.push({n,p,talla:btn.previousElementSibling.value});
 abrirCarrito();actualizarTotales();
}

function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}

function actualizarTotales(){
 const div=document.getElementById("items");
 div.innerHTML="";let total=0;

 carrito.forEach((it,i)=>{
  total+=it.p;
  div.innerHTML+=`
   <div class="item">
    <span>${it.n} (${it.talla}) - ${it.p}€</span>
    <button onclick="carrito.splice(${i},1);actualizarTotales()">✖</button>
   </div>`;
 });

 const badge=document.getElementById("badge");
 badge.style.display=carrito.length?"flex":"none";
 badge.textContent=carrito.length;

 let descuento=carrito.length>1?(carrito.length-1)*2:0;
 let envio=document.getElementById("pais").value=="ES"?5:
           document.getElementById("pais").value=="EU"?12:20;
 let final=total-descuento+envio;

 document.getElementById("resumen").innerHTML=
 `Productos: ${total}€<br>
 <span class="descuento">Descuento: -${descuento}€</span><br>
 Envío: ${envio}€<br>
 <b>Total: ${final}€</b>`;

 document.getElementById("paypal-button-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:final.toFixed(2)}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>alert("Pago PayPal realizado"))
 }).render("#paypal-button-container");
}

function pagoTarjeta(){
 if(!carrito.length){alert("Carrito vacío");return;}
 alert("Pago con tarjeta simulado (requiere Stripe backend)");
}
</script>

</body>
</html>
