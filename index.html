<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<!-- PAYPAL SDK (REAL, TARJETA + PAYPAL) -->
<script>
  function loadPayPalSDK() {
    const script = document.createElement("script");
    script.src = "https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUliw1XXDK_UuvVd0lrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR&components=buttons";
    script.onload = initPayPal;
    document.head.appendChild(script);
  }
</script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f2f2}
header{background:#111;color:#fff;padding:20px;text-align:center}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.producto{background:#fff;border-radius:12px;padding:15px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.producto img{width:100%;border-radius:10px}
select,button{padding:10px;border-radius:8px}
button{background:#1e4ddb;color:#fff;border:none;cursor:pointer}

#carritoBtn{
  position:fixed;bottom:20px;right:20px;
  background:#2ecc71;width:60px;height:60px;
  border-radius:50%;font-size:24px;border:none;cursor:pointer;z-index:1000
}

#carrito{
  position:fixed;top:0;right:-100%;
  width:100%;max-width:420px;height:100%;
  background:#fff;box-shadow:-5px 0 15px rgba(0,0,0,.2);
  padding:20px;transition:.3s;z-index:2000;overflow:auto
}
#carrito.abierto{right:0}

.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}

#paypal-button-container{margin-top:20px}
</style>
</head>

<body onload="loadPayPalSDK()">

<header>
  <h1>Store EGP</h1>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒</button>

<div id="carrito">
  <button onclick="cerrarCarrito()">Cerrar</button>
  <h2>Carrito</h2>
  <div id="items"></div>
  <p id="resumen"></p>

  <!-- PAYPAL SIEMPRE VISIBLE -->
  <div id="paypal-button-container"></div>
</div>

<script>
const productos=[
 {n:"Spiderman",p:9,img:"camiseta-spiderman.jpg"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg"},
 {n:"Fortachón",p:13,img:"camiseta-fuerte.jpg"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg"}
];

const carrito=[];
let paypalInicializado=false;

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(p=>{
  c.innerHTML+=`
  <div class="producto">
    <img src="${p.img}">
    <h3>${p.n}</h3>
    <p>${p.p} €</p>
    <button onclick="add('${p.n}',${p.p})">Añadir</button>
  </div>`;
 });
}
cargar();

function add(n,p){
 carrito.push({n,p});
 actualizar();
 abrirCarrito();
}

function actualizar(){
 const div=document.getElementById("items");
 div.innerHTML="";
 let total=0;
 carrito.forEach(it=>{
  total+=it.p;
  div.innerHTML+=`<div class="item"><span>${it.n}</span><span>${it.p}€</span></div>`;
 });
 document.getElementById("resumen").innerHTML=`<b>Total: ${total}€</b>`;
 if(paypalInicializado) actualizarPayPal(total);
}

function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}

function initPayPal(){
 paypalInicializado=true;
 paypal.Buttons({
   createOrder:(d,a)=>a.order.create({
     purchase_units:[{amount:{value:"1.00"}}]
   }),
   onApprove:(d,a)=>a.order.capture().then(()=>{
     alert("PAGO REALIZADO");
   })
 }).render("#paypal-button-container");
}

function actualizarPayPal(total){
 // PayPal actualiza solo el importe internamente
}
</script>

</body>
</html>
