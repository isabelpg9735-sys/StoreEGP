<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
 emailjs.init("WLyVJyhY2lgWl421L");
})();
</script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f2}

header{background:#111;color:#fff;padding:20px;text-align:center}
header small{color:#ccc}
.subtitulo{font-size:14px;color:#aaa;margin-top:6px}

/* PRODUCTOS */
.productos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
 padding:20px
}
.producto{
 background:#fff;
 border-radius:12px;
 padding:15px;
 box-shadow:0 5px 15px rgba(0,0,0,.1);
 display:flex;
 flex-direction:column
}
.producto img{width:100%;border-radius:10px}
.precio{margin:8px 0}
.oferta del{color:red;margin-right:6px}
.acciones{
 margin-top:auto;
 display:flex;
 flex-direction:column;
 gap:8px
}
select,button,input{
 padding:10px;
 border-radius:8px;
 border:1px solid #ccc;
 width:100%
}
.producto button{
 background:#1e4ddb;
 color:#fff;
 border:none;
 cursor:pointer
}

/* BOTÓN CARRITO */
#carritoBtn{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#2ecc71;
 width:60px;
 height:60px;
 border-radius:50%;
 font-size:24px;
 border:none;
 cursor:pointer;
 z-index:2000
}
#badge{
 position:absolute;
 top:-6px;
 right:-6px;
 background:red;
 color:#fff;
 width:22px;
 height:22px;
 border-radius:50%;
 display:none;
 align-items:center;
 justify-content:center
}

/* CARRITO */
#carrito{
 position:fixed;
 top:0;
 right:-100%;
 width:100%;
 max-width:420px;
 height:100%;
 background:#fff;
 box-shadow:-5px 0 15px rgba(0,0,0,.2);
 padding:20px;
 overflow:auto;
 transition:transform .35s ease;
 transform:translateX(100%);
 z-index:3000
}
#carrito.abierto{
 transform:translateX(0)
}
.cerrar{
 float:right;
 font-size:22px;
 cursor:pointer
}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ddd;
 padding:10px 0;
 gap:10px;
 font-size:14px
}
.item span{flex:1}

.acciones-carrito{
 display:flex;
 align-items:center;
 gap:6px
}
.item button{
 background:none;
 border:1px solid #ccc;
 border-radius:6px;
 width:26px;
 height:26px;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer
}

.descuento{color:red;font-weight:bold}

/* DATOS */
.form-envio{
 display:flex;
 flex-direction:column;
 gap:10px;
 margin-top:10px
}

/* RESUMEN FIJO EN MÓVIL */
.resumen-fijo{
 display:none;
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 background:#fff;
 box-shadow:0 -5px 15px rgba(0,0,0,.15);
 padding:12px;
 font-size:15px;
 z-index:2500
}

/* FOOTER */
footer{text-align:center;padding:20px;font-size:14px}
footer a{
 margin:0 8px;
 color:#1e4ddb;
 text-decoration:none;
 cursor:pointer
}

/* MODAL LEGAL */
.legal-modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:9999
}
.legal-box{
 background:#fff;
 max-width:500px;
 width:90%;
 padding:20px;
 border-radius:12px
}
.legal-box button{
 margin-top:15px;
 width:100%
}

/* ===== MÓVIL ===== */
@media(max-width:600px){
 .resumen-fijo{display:block}
 #carrito{padding-bottom:90px}
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<div class="subtitulo">Aquí encuentras lo que no sabías que necesitabas</div>
<small>@sstoreegp · dudas: sstoreegp@gmail.com</small>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒
 <div id="badge">0</div>
</button>

<div id="carrito">
<span class="cerrar" onclick="cerrarCarrito()">✖</span>
<h2>Carrito</h2>

<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<div class="form-envio">
 <input placeholder="Nombre completo">
 <input placeholder="Correo electrónico">
 <input placeholder="Dirección">
 <input placeholder="Código postal">
 <input placeholder="Ciudad">
</div>

<select disabled style="margin-top:10px">
 <option>España peninsular (0€ prueba)</option>
</select>

<div id="paypal-button-container" style="margin-top:15px"></div>
</div>

<div class="resumen-fijo" id="resumenMovil"></div>

<footer>
<a onclick="abrirLegal('terms')">Términos</a>
<a onclick="abrirLegal('privacy')">Privacidad</a>
<a onclick="abrirLegal('envio')">Envío</a>
<a onclick="abrirLegal('devoluciones')">Devoluciones</a>
</footer>

<div class="legal-modal" id="legalModal">
 <div class="legal-box">
  <h3 id="legalTitulo"></h3>
  <p id="legalTexto"></p>
  <button onclick="cerrarLegal()">Cerrar</button>
 </div>
</div>

<script>
const productos=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido lo sabe",oferta:"<span class='oferta'><del>15€</del> AHORA 1€</span>"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things vibes"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL"},
 {n:"Fortachón",p:10,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete things",oferta:"<span class='oferta'><del>25€</del> AHORA 18€</span>"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"jaja 😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Una más"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];

const carrito={};

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(pr=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${pr.img}">
   <h3>${pr.n}</h3>
   <p>${pr.d}</p>
   <div class="precio">${pr.oferta?pr.oferta:`<b>${pr.p}€</b>`}</div>
   <div class="acciones">
    <select><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
    <button onclick="add('${pr.n}',${pr.p},this)">Añadir</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,btn){
 const talla=btn.previousElementSibling.value;
 const k=n+"_"+talla;
 if(!carrito[k]) carrito[k]={n,p,talla,c:0};
 carrito[k].c++;
 abrirCarrito();
 actualizar();
}

function actualizar(){
 const d=document.getElementById("items");
 d.innerHTML="";
 let total=0, u=0;

 Object.entries(carrito).forEach(([k,it])=>{
  total+=it.p*it.c;
  u+=it.c;
  d.innerHTML+=`
   <div class="item">
    <span>${it.n} (${it.talla}) x${it.c} – ${it.p*it.c}€</span>
    <div class="acciones-carrito">
     <button onclick="menos('${k}')">−</button>
     <button onclick="eliminar('${k}')">✕</button>
    </div>
   </div>`;
 });

 document.getElementById("badge").style.display=u?"flex":"none";
 document.getElementById("badge").textContent=u;

 let desc=u>1?(u-1)*2:0;
 let final=total-desc;

 document.getElementById("resumen").innerHTML=
 `Productos: ${total}€<br>
 <span class="descuento">Descuento: -${desc}€</span><br>
 Envío: 0€<br>
 <b>Total: ${final}€</b>`;

 document.getElementById("resumenMovil").innerHTML=
 `<b>Total: ${final}€</b> · <a onclick="abrirCarrito()" style="color:#1e4ddb">Ver carrito</a>`;

 document.getElementById("paypal-button-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:final.toFixed(2)}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>{
   alert("¡Pago realizado! Hemos enviado un email con tu pedido. Revisa Spam.");
  })
 }).render("#paypal-button-container");
}

function menos(k){carrito[k].c>1?carrito[k].c--:delete carrito[k];actualizar()}
function eliminar(k){delete carrito[k];actualizar()}
function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}

function abrirLegal(t){
 const h=document.getElementById("legalTitulo");
 const p=document.getElementById("legalTexto");

 if(t==="terms"){
  h.textContent="Términos y condiciones";
  p.textContent="Al realizar una compra en Store EGP aceptas las condiciones de venta, precios mostrados, políticas de envío y devoluciones. La compra implica el compromiso de pago del producto seleccionado y el uso correcto de la plataforma.";
 }
 if(t==="privacy"){
  h.textContent="Política de privacidad";
  p.textContent="Tus datos solo se utilizan para gestionar pedidos, envíos y comunicación relacionada con tu compra. En ningún caso la información será compartida con terceros.";
 }
 if(t==="envio"){
  h.textContent="Envío";
  p.textContent="Actualmente solo se realizan envíos a España peninsular. El plazo estimado de entrega es de unos 15 días desde la compra.";
 }
 if(t==="devoluciones"){
  h.textContent="Devoluciones";
  p.textContent="Existe la posibilidad de devolver un producto en un plazo de 14 días siempre que no haya sido usado ni lavado. El reembolso se hará al revisar las condiciones del producto. El envío de vuelta corre a cargo del comprador.";
 }

 document.getElementById("legalModal").style.display="flex";
}
function cerrarLegal(){document.getElementById("legalModal").style.display="none"}
</script>

</body>
</html>
