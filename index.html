<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<script src="https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUliw1XXDK_UuvVd0lrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR&components=buttons,funding-eligibility"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f2}

header{background:#111;color:#fff;padding:20px;text-align:center}
.subtitulo{font-size:14px;color:#aaa}
header small{color:#ccc}

.productos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
 padding:20px;
}

.producto{
 background:#fff;
 padding:15px;
 border-radius:12px;
 box-shadow:0 5px 15px rgba(0,0,0,.1);
 display:flex;
 flex-direction:column;
}

.producto img{width:100%;border-radius:10px}
.producto h3{margin:10px 0 5px}
.producto p{margin:5px 0}

.oferta del{color:red;margin-right:6px}
.oferta{font-weight:bold}

.acciones{margin-top:auto;display:flex;flex-direction:column;gap:8px}

select,button,input{
 padding:10px;
 border-radius:8px;
 border:1px solid #ccc;
 width:100%;
}

button{background:#1e4ddb;color:#fff;border:none;cursor:pointer}
button:hover{opacity:.9}

#carritoBtn{
 position:fixed;
 bottom:20px;
 right:20px;
 width:60px;
 height:60px;
 border-radius:50%;
 font-size:24px;
 background:#2ecc71;
 border:none;
 cursor:pointer;
 z-index:999;
}

#badge{
 position:absolute;
 top:-6px;
 right:-6px;
 background:red;
 color:#fff;
 width:22px;
 height:22px;
 border-radius:50%;
 display:none;
 align-items:center;
 justify-content:center;
 font-size:12px;
}

#carrito{
 position:fixed;
 top:0;
 right:-100%;
 width:100%;
 max-width:420px;
 height:100%;
 background:#fff;
 box-shadow:-5px 0 15px rgba(0,0,0,.2);
 padding:20px;
 overflow:auto;
 transition:.3s;
 z-index:1000;
}
#carrito.abierto{right:0}
.cerrar{float:right;font-size:22px;cursor:pointer}

.item{
 display:flex;
 justify-content:space-between;
 padding:8px 0;
 border-bottom:1px solid #ddd;
}

.item button{background:none;color:red;font-size:18px}

.campo{margin-bottom:10px}

.descuento{color:red;font-weight:bold}

footer{text-align:center;padding:20px}
footer a{margin:0 10px;color:#1e4ddb;text-decoration:none}

.legal-modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:9999;
}
.legal-box{
 background:#fff;
 padding:20px;
 border-radius:12px;
 max-width:500px;
 width:90%;
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<div class="subtitulo">Aquí encuentras lo que no sabías que buscabas</div>
<small>@sstoreegp · sstoreegp@gmail.com</small>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒
<div id="badge">0</div>
</button>

<div id="carrito">
<span class="cerrar" onclick="cerrarCarrito()">✖</span>
<h2>Carrito</h2>

<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<div class="campo"><input id="nombre" placeholder="Nombre completo"></div>
<div class="campo"><input id="email" placeholder="Email"></div>
<div class="campo"><input id="direccion" placeholder="Dirección"></div>
<div class="campo"><input id="cp" placeholder="Código Postal"></div>
<div class="campo"><input id="ciudad" placeholder="Ciudad"></div>

<p><b>Envío:</b> España peninsular · 0€ (prueba)</p>

<!-- PAYPAL SIEMPRE PRESENTE -->
<div id="paypal-button-container"></div>
</div>

<footer>
<a href="#" onclick="abrirLegal('returns')">Devoluciones</a>
<a href="#" onclick="abrirLegal('shipping')">Envíos</a>
</footer>

<div class="legal-modal" id="legalModal">
<div class="legal-box">
<h2 id="legalTitulo"></h2>
<p id="legalTexto"></p>
<button onclick="cerrarLegal()">Cerrar</button>
</div>
</div>

<script>
emailjs.init("WLyVJyhY2lgWl421L");

const carrito=[];
let totalActual=0;

const productos=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido",oferta:"<span class='oferta'><del>15€</del> AHORA 1€</span>"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete things",oferta:"<span class='oferta'><del>25€</del> AHORA 18€</span>"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL"},
 {n:"Fortachón",p:13,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre tienes razón"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Diseño rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Eres un borracho"},
 {n:"Kill Humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(p=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${p.img}">
   <h3>${p.n}</h3>
   <p>${p.d}</p>
   ${p.oferta?p.oferta:`<b>${p.p}€</b>`}
   <div class="acciones">
    <select><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
    <button onclick="add('${p.n}',${p.p},this)">Añadir</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,b){
 carrito.push({n,p,talla:b.previousElementSibling.value});
 actualizar();
 abrirCarrito();
}

function actualizar(){
 const items=document.getElementById("items");
 items.innerHTML="";
 let total=0;

 carrito.forEach((it,i)=>{
  total+=it.p;
  items.innerHTML+=`<div class="item">${it.n} (${it.talla}) <button onclick="quitar(${i})">✖</button></div>`;
 });

 let descuento = carrito.length>1 ? (carrito.length-1)*2 : 0;
 totalActual = total - descuento;

 document.getElementById("resumen").innerHTML=
 `Productos: ${total}€<br>
 <span class="descuento">Descuento: -${descuento}€</span><br>
 <b>Total: ${totalActual}€</b>`;

 document.getElementById("badge").style.display=carrito.length?"flex":"none";
 document.getElementById("badge").textContent=carrito.length;
}

function quitar(i){carrito.splice(i,1);actualizar()}
function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}

paypal.Buttons({
 createOrder:(d,a)=>a.order.create({
  purchase_units:[{amount:{value:()=>totalActual.toFixed(2)}}]
 }),
 onApprove:(d,a)=>a.order.capture().then(()=>{
  alert("Pago realizado correctamente");
  carrito.length=0;
  actualizar();
  cerrarCarrito();
 })
}).render("#paypal-button-container");

function abrirLegal(t){
 const T=document.getElementById("legalTitulo");
 const P=document.getElementById("legalTexto");
 if(t==="returns") P.textContent="14 días, sin usar ni lavar. Envío a cargo del comprador.";
 if(t==="shipping") P.textContent="Solo envíos a España peninsular.";
 document.getElementById("legalModal").style.display="flex";
}
function cerrarLegal(){document.getElementById("legalModal").style.display="none"}
</script>

</body>
</html>

</html>
