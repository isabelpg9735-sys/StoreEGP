<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
}

/* HEADER */
header{
  background:#111;
  color:white;
  padding:30px 20px;
  text-align:center;
}
header input{
  margin-top:15px;
  padding:12px;
  width:100%;
  max-width:400px;
  border-radius:6px;
  border:none;
}

/* GRID */
.productos{
  max-width:1400px;
  margin:auto;
  padding:30px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:25px;
}

/* CARD */
.producto{
  background:white;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  display:flex;
  flex-direction:column;
  transition:.3s;
}
.producto:hover{transform:translateY(-6px)}

.producto img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#fafafa;
  padding:15px;
}

.info{
  padding:15px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.info h3{margin:5px 0}
.precio{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.badge{
  background:gold;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  width:max-content;
  margin-bottom:6px;
}

.info button{
  margin-top:auto;
  padding:12px;
  border:none;
  border-radius:6px;
  background:#007bff;
  color:white;
  cursor:pointer;
}
.info button:hover{background:#0056b3}

/* PLACEHOLDER */
.placeholder{
  background:#ddd;
  border:3px dashed #aaa;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:bold;
}

/* CARRITO */
#btnCarrito{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#28a745;
  color:white;
  font-size:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
}

#carrito{
  position:fixed;
  right:-350px;
  top:0;
  width:350px;
  height:100%;
  background:white;
  padding:20px;
  transition:.4s;
}
#carrito.abierto{right:0}
#overlay.activo{display:block}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:14px;
}

.total{
  font-weight:bold;
  margin:15px 0;
}

/* CONTACTO */
.contacto{
  background:white;
  padding:30px;
  margin:40px auto;
  max-width:500px;
  border-radius:10px;
}
.contacto input,.contacto textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
}
.contacto button{
  padding:12px;
  width:100%;
  border:none;
  background:#28a745;
  color:white;
  border-radius:6px;
}

/* MOBILE */
@media(max-width:600px){
  #carrito{width:100%}
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<p>Encuentra los mejores productos</p>
<input placeholder="Buscar productos..." oninput="buscar(this.value)">
</header>

<div id="btnCarrito" onclick="abrir()">🛒</div>
<div id="overlay" onclick="cerrar()"></div>

<section class="productos">

<!-- PRODUCTOS ORIGINALES -->
<div class="producto" data-nombre="Alejense Gordas" data-precio="12">
<img src="camiseta-clash.jpg">
<div class="info">
<span class="badge">DESTACADO</span>
<h3>Alejense Gordas</h3>
<div class="precio">12 €</div>
<button onclick="add(this)">Añadir al carrito</button>
</div>
</div>

<div class="producto" data-nombre="South Things" data-precio="17">
<img src="camiseta-south-things.jpg">
<div class="info">
<h3>South Things</h3>
<div class="precio">17 €</div>
<button onclick="add(this)">Añadir al carrito</button>
</div>
</div>

<div class="producto" data-nombre="Jhon Pork" data-precio="16">
<img src="camiseta-pork.jpg">
<div class="info">
<h3>Jhon Pork</h3>
<div class="precio">16 €</div>
<button onclick="add(this)">Añadir al carrito</button>
</div>
</div>

<div class="producto" data-nombre="Steve Harrington" data-precio="16">
<img src="camiseta-steve.jpg">
<div class="info">
<h3>Steve Harrington</h3>
<div class="precio">16 €</div>
<button onclick="add(this)">Añadir al carrito</button>
</div>
</div>

<!-- HUECOS EXTRA -->
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>
<div class="producto placeholder">Producto futuro</div>

</section>

<!-- CARRITO -->
<div id="carrito">
<h3>Carrito</h3>
<div id="lista"></div>
<div class="total">Total: <span id="total">0</span> €</div>

<form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
<input type="hidden" name="pedido" id="pedido">
<button>Finalizar compra</button>
</form>
</div>

<!-- CONTACTO -->
<div class="contacto">
<h2>Contacto</h2>
<form action="https://formspree.io/f/TU_ID_AQUI" method="POST">
<input name="nombre" placeholder="Nombre" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="mensaje" placeholder="Mensaje" required></textarea>
<button>Enviar</button>
</form>
</div>

<script>
let carrito=[];
const lista=document.getElementById("lista");
const total=document.getElementById("total");
const pedido=document.getElementById("pedido");
const carritoDiv=document.getElementById("carrito");
const overlay=document.getElementById("overlay");

function add(b){
 const p=b.closest(".producto");
 const n=p.dataset.nombre;
 const pr=+p.dataset.precio;
 const it=carrito.find(i=>i.n===n);
 it?it.c++:carrito.push({n,pr,c:1});
 render(); abrir();
}

function render(){
 lista.innerHTML="";
 let t=0;
 carrito.forEach(i=>{
  t+=i.pr*i.c;
  lista.innerHTML+=`<div class="item"><span>${i.n} x${i.c}</span><span>${i.pr*i.c}€</span></div>`;
 });
 total.textContent=t;
 pedido.value=JSON.stringify(carrito);
}

function abrir(){carritoDiv.classList.add("abierto");overlay.classList.add("activo")}
function cerrar(){carritoDiv.classList.remove("abierto");overlay.classList.remove("activo")}

function buscar(t){
 t=t.toLowerCase();
 document.querySelectorAll(".producto").forEach(p=>{
  const n=p.dataset.nombre?.toLowerCase()||"";
  p.style.display=n.includes(t)||p.classList.contains("placeholder")?"flex":"none";
 });
}
</script>

</body>
</html>
