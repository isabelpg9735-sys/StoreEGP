<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<style>
:root{
--bg:#f3f3f3;--card:#fff;--primary:#1d4ed8;--accent:#22c55e;--radius:16px
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:var(--bg)}
header{background:#000;color:#fff;padding:35px 20px;text-align:center}
header p{opacity:.85}
header input{margin-top:15px;padding:14px;width:100%;max-width:420px;border-radius:999px;border:none}
.productos{max-width:1500px;margin:auto;padding:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px}
.producto{background:var(--card);border-radius:var(--radius);box-shadow:0 15px 35px rgba(0,0,0,.1);display:flex;flex-direction:column;overflow:hidden}
.producto img{height:260px;object-fit:contain;background:#fafafa;padding:20px}
.info{padding:20px;display:flex;flex-direction:column;flex:1}
.info h3{margin:0 0 5px}
.descripcion{font-size:14px;opacity:.8}
.precio{font-size:22px;font-weight:bold;margin:10px 0}
select,button,input{padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px}
button{background:var(--primary);color:#fff;border:none;cursor:pointer}
#btnCarrito{position:fixed;bottom:20px;right:20px;width:65px;height:65px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none}
#carrito{position:fixed;top:0;right:-420px;width:420px;height:100%;background:#fff;padding:25px;transition:.4s;display:flex;flex-direction:column}
#carrito.abierto{right:0} #overlay.activo{display:block}
#lista{flex:1;overflow:auto}
.item{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.total{font-size:18px;font-weight:bold}
.cerrar{align-self:flex-end;font-size:22px;cursor:pointer}
@media(max-width:500px){#carrito{width:100%}}
</style>

<script src="https://www.paypal.com/sdk/js?client-id=TU_CLIENT_ID_REAL&currency=EUR"></script>
</head>

<body>

<header>
<h1>Store EGP</h1>
<p>Ropa con personalidad propia · Cualquier duda: sstoreegp@gmail.com</p>
<input placeholder="Buscar productos..." oninput="buscar(this.value)">
</header>

<div id="btnCarrito" onclick="abrir()">🛒</div>
<div id="overlay" onclick="cerrar()"></div>

<section class="productos">

<div class="producto" data-nombre="Alejense Gordas" data-precio="12">
<img src="camiseta-clash.jpg">
<div class="info">
<h3>Alejense Gordas</h3>
<p class="descripcion">Camiseta cómoda y resistente</p>
<select class="talla">
<option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<div class="precio">12 €</div>
<button onclick="add(this)">Añadir al carrito</button>
</div></div>

<div class="producto" data-nombre="Pedrito" data-precio="15">
<img src="camiseta-pedrito.jpg">
<div class="info">
<h3>Pedrito</h3>
<p class="descripcion">El mítico Pedrito</p>
<select class="talla"><option>S</option><option>M</option><option>L</option><option>XL</option></select>
<div class="precio">15 €</div>
<button onclick="add(this)">Añadir al carrito</button>
</div></div>

<!-- (PUEDES AÑADIR MÁS PRODUCTOS IGUAL QUE ESTOS, NO SE BORRA NINGUNO) -->

</section>

<div id="carrito">
<div class="cerrar" onclick="cerrar()">❌</div>
<h2>Tu carrito</h2>
<div id="lista"></div>

<label>País de envío</label>
<select id="pais" onchange="render()">
<option value="es">España (5€)</option>
<option value="eu">Europa cercana (12€)</option>
<option value="otro">Otro país (20€)</option>
</select>

<p id="descuento" style="color:green;font-weight:bold"></p>
<p id="envio"></p>
<div class="total">Total final: <span id="total">0</span> €</div>

<h3>Datos de envío</h3>
<input placeholder="Nombre completo" required>
<input placeholder="Dirección" required>
<input placeholder="Ciudad" required>
<input placeholder="Código postal" required>
<input placeholder="Email" required>

<label>
<input type="checkbox" id="legalCheck"> Acepto condiciones legales y envíos
</label>

<div id="paypal-button-container"></div>

<p style="margin-top:20px;opacity:.7">Envíos a casi todo el mundo</p>
</div>

<script>
let carrito=JSON.parse(localStorage.getItem("carrito"))||[];
const lista=document.getElementById("lista");
const total=document.getElementById("total");

function add(btn){
 const p=btn.closest(".producto");
 carrito.push({
  n:p.dataset.nombre,
  pr:+p.dataset.precio,
  talla:p.querySelector(".talla").value
 });
 save(); abrir();
}

function calcular(){
 let subtotal=carrito.reduce((s,i)=>s+i.pr,0);
 let desc=Math.max(0,(carrito.length-1)*2);
 let envio=document.getElementById("pais").value=="es"?5:
            document.getElementById("pais").value=="eu"?12:20;
 document.getElementById("descuento").textContent=
  desc?`Descuento aplicado: -${desc}€`:"";
 document.getElementById("envio").textContent=`Envío: ${envio}€`;
 return subtotal-desc+envio;
}

function render(){
 lista.innerHTML="";
 carrito.forEach(i=>{
  lista.innerHTML+=`<div class="item"><span>${i.n} (${i.talla})</span><span>${i.pr}€</span></div>`;
 });
 total.textContent=calcular();
 localStorage.setItem("carrito",JSON.stringify(carrito));
}

function abrir(){document.getElementById("carrito").classList.add("abierto");overlay.classList.add("activo")}
function cerrar(){document.getElementById("carrito").classList.remove("abierto");overlay.classList.remove("activo")}
function buscar(t){document.querySelectorAll(".producto").forEach(p=>p.style.display=p.dataset.nombre.toLowerCase().includes(t.toLowerCase())?"flex":"none")}

paypal.Buttons({
createOrder:(d,a)=>{
 if(!document.getElementById("legalCheck").checked){
  alert("Debes aceptar las condiciones");throw"";
 }
 return a.order.create({purchase_units:[{amount:{value:calcular().toString()}}]});
},
onApprove:(d,a)=>a.order.capture().then(()=>{
 alert("Pago realizado correctamente");
 carrito=[];render();cerrar();
})
}).render('#paypal-button-container');

render();
</script>

</body>
</html>
