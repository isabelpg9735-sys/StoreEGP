<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SStoreEGP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script src="https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUIiw1XXDK_UuvVd0IrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{text-align:center;padding:15px;background:#000;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding:15px}
.product{background:#fff;padding:10px;border-radius:8px}
.cart{position:fixed;right:10px;top:10px;background:#000;color:#fff;padding:10px;border-radius:50%;cursor:pointer}
#cartBox{display:none;position:fixed;right:10px;top:60px;background:#fff;width:320px;padding:10px;border-radius:8px;z-index:10}
.cart-item{display:flex;justify-content:space-between}
input{width:100%;margin-bottom:6px;padding:6px}
</style>
</head>

<body>

<header>
<h1>@sstoreegp</h1>
<p>Cualquier duda a sstoreegp@gmail.com</p>
</header>

<div class="cart" onclick="toggleCart()">🛒</div>

<div id="cartBox">
<h3>Datos de envío</h3>
<input id="name" placeholder="Nombre completo">
<input id="email" placeholder="Email">
<input id="address" placeholder="Dirección exacta">
<input id="cp" placeholder="Código postal">
<input id="city" placeholder="Ciudad">
<input id="prov" placeholder="Provincia">

<hr>

<div id="cartItems"></div>
<p><b>Total: €<span id="total">0</span></b></p>
<div id="paypal-button-container"></div>
</div>

<div class="products" id="products"></div>

<script>
emailjs.init("WLyVJyhY2lgWl421L");

const products=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido lo sabe"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things vibes"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL"},
 {n:"Fortachón",p:10,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete things"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"jaja 😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Una más"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];

let cart=[];

function renderProducts(){
 const c=document.getElementById("products");
 products.forEach((p,i)=>{
  c.innerHTML+=`
  <div class="product">
   <h3>${p.n}</h3>
   <p>${p.d}</p>
   <b>${p.p}€</b><br>
   <button onclick="add(${i})">Añadir</button>
  </div>`;
 });
}
renderProducts();

function add(i){
 const f=cart.find(x=>x.i===i);
 if(f)f.q++; else cart.push({i,q:1});
 renderCart();
}

function renderCart(){
 const c=document.getElementById("cartItems");
 let t=0; c.innerHTML="";
 cart.forEach(it=>{
  const p=products[it.i];
  t+=p.p*it.q;
  c.innerHTML+=`<div class="cart-item">${p.n} x${it.q}<b>${p.p*it.q}€</b></div>`;
 });
 document.getElementById("total").textContent=t.toFixed(2);
}

function toggleCart(){
 const b=document.getElementById("cartBox");
 b.style.display=b.style.display==="block"?"none":"block";
}

paypal.Buttons({
 createOrder(){
  if(!name.value||!email.value||!address.value||!cp.value||!city.value||!prov.value){
   alert("Rellena todos los datos de envío");
   throw new Error();
  }
  return {purchase_units:[{amount:{value:total.textContent}}]};
 },
 onApprove(data,actions){
  return actions.order.capture().then(()=>{
   const productos=cart.map(it=>{
    const p=products[it.i];
    return `${p.n} x${it.q}`;
   }).join(", ");

   const params={
    to_email: email.value,
    cliente: name.value,
    direccion: `${address.value}, ${cp.value}, ${city.value}, ${prov.value}`,
    productos: productos,
    total: total.textContent
   };

   emailjs.send("service_ko8t2at","template_y9fr06m",params);
   emailjs.send("service_ko8t2at","template_y9fr06m",{...params,to_email:"sstoreegp@gmail.com"});

   alert("¡Pago realizado! Hemos enviado un email con tu pedido.");
   location.href=location.href;
  });
 }
}).render("#paypal-button-container");
</script>

</body>
</html>
