<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<!-- PAYPAL PRUEBAS -->
<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#111;color:#fff;text-align:center;padding:20px}
.subtitulo{font-size:14px;color:#bbb;margin-top:5px}

.productos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;padding:20px
}
.producto{
 background:#fff;border-radius:12px;
 padding:15px;display:flex;flex-direction:column;
 box-shadow:0 4px 12px rgba(0,0,0,.1)
}
.producto img{width:100%;border-radius:10px}
.precio{font-weight:bold;margin:6px 0}
.oferta del{color:red;margin-right:6px}

.acciones{
 margin-top:auto;
 display:flex;
 flex-direction:column;
 gap:10px
}

select,button,input{
 padding:10px;border-radius:8px;border:1px solid #ccc
}
.producto button{
 background:#1e4ddb;color:#fff;border:none;cursor:pointer
}

#carritoBtn{
 position:fixed;bottom:20px;right:20px;
 background:#2ecc71;color:#fff;
 width:60px;height:60px;border-radius:50%;
 font-size:24px;border:none;cursor:pointer
}
#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:#fff;
 width:22px;height:22px;border-radius:50%;
 display:none;align-items:center;justify-content:center;
 font-size:12px
}

#carrito{
 position:fixed;top:0;right:-100%;
 width:100%;max-width:420px;height:100%;
 background:#fff;transition:.3s;
 padding:20px;overflow:auto;z-index:999
}
#carrito.abierto{right:0}
.cerrar{float:right;font-size:22px;cursor:pointer}

.item{
 display:grid;
 grid-template-columns:1fr auto auto;
 gap:10px;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid #ddd
}
.item .info{font-size:14px}
.item .precio{font-weight:bold}
.item button{
 background:none;border:none;
 color:red;font-size:16px;cursor:pointer
}

.legal-links button{
 background:none;border:none;
 color:#1e4ddb;cursor:pointer;
 margin-right:10px;padding:0
}

#payment-success{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.6);
 z-index:2000;align-items:center;justify-content:center
}
#payment-success .box{
 background:#fff;padding:25px;
 border-radius:12px;text-align:center;
 max-width:420px;width:90%
}
</style>
</head>

<body>

<header>
<h1>Store EGP</h1>
<div class="subtitulo">Aquí encuentras lo que no sabías que buscabas</div>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒<div id="badge">0</div></button>

<div id="carrito">
<span class="cerrar" onclick="cerrarCarrito()">✖</span>
<h2>Carrito</h2>

<div id="items"></div>
<p id="resumen"></p>

<h3>Datos de envío</h3>
<input placeholder="Correo electrónico">
<input placeholder="Nombre completo">
<input placeholder="Dirección">
<input placeholder="Código postal">
<input placeholder="Ciudad">

<p><b>Envío:</b> España peninsular · <b>0€ (prueba)</b></p>

<div id="paypal-button-container"></div>

<div class="legal-links" style="margin-top:20px">
<button onclick="alert('Solo envíos a España peninsular. Entrega aproximada 15 días.')">Envíos</button>
<button onclick="alert('Devoluciones en 14 días si la prenda no ha sido usada ni lavada. El envío corre a cargo del comprador.')">Devoluciones</button>
</div>
</div>

<div id="payment-success">
<div class="box">
<h2>¡Pago realizado!</h2>
<p>
Hemos enviado un email con tu pedido.<br>
Cuando se envíe recibirás el seguimiento.<br><br>
<b>Revisa Spam</b>
</p>
<button onclick="cerrarSuccess()">Aceptar</button>
</div>
</div>

<script>
const productos=[
 {n:"Spiderman",p:1,img:"spiderman.jpg",t:true},
 {n:"Rarete",p:18,img:"rarete.jpg",o:20},
 {n:"South Things",p:17,img:"south.jpg"},
 {n:"EGP Classic",p:12,img:"classic.jpg"},
 {n:"EGP Dark",p:14,img:"dark.jpg"}
];

const carrito=[];

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(p=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${p.img}">
   <h3>${p.n}</h3>
   <div class="precio">
    ${p.o?`<span class="oferta"><del>${p.o}€</del></span>`:""}
    ${p.p} €
   </div>
   <div class="acciones">
    <select>
     <option>XS</option><option>S</option><option>M</option>
     <option>L</option><option>XL</option>
    </select>
    <button onclick="add('${p.n}',${p.p},this)">Añadir al carrito</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,btn){
 const t=btn.previousElementSibling.value;
 const item=carrito.find(i=>i.n===n&&i.t===t);
 if(item){item.q++}else{carrito.push({n,p,t,q:1})}
 abrirCarrito();actualizar();
}

function actualizar(){
 const div=document.getElementById("items");
 div.innerHTML="";
 let total=0,count=0;

 carrito.forEach((i,idx)=>{
  total+=i.p*i.q;count+=i.q;
  div.innerHTML+=`
  <div class="item">
   <div class="info">${i.n} (${i.t}) x${i.q}</div>
   <div class="precio">${i.p*i.q}€</div>
   <button onclick="quitar(${idx})">✖</button>
  </div>`;
 });

 document.getElementById("badge").style.display=count?"flex":"none";
 document.getElementById("badge").textContent=count;
 document.getElementById("resumen").innerHTML=`<b>Total: ${total}€</b>`;

 document.getElementById("paypal-button-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:total.toFixed(2)}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>{
   document.getElementById("payment-success").style.display="flex";
   carrito.length=0;actualizar();
  })
 }).render("#paypal-button-container");
}

function quitar(i){carrito.splice(i,1);actualizar()}
function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}
function cerrarSuccess(){document.getElementById("payment-success").style.display="none"}
</script>

</body>
</html>
