<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store EGP</title>

<!-- PAYPAL REAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AXT9Rz8ikVS_WVQfA3fLGG4YK1lUliw1XXDK_UuvVd0lrzYds4I9tW6J1ixXPgwhwjOWr7HTqqZ6G9kh&currency=EUR"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#111;color:#fff;padding:20px;text-align:center}
.subtitulo{color:#aaa;font-size:14px;margin-top:6px}

.productos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:20px;padding:20px
}
.producto{
 background:#fff;border-radius:12px;padding:15px;
 box-shadow:0 5px 15px rgba(0,0,0,.1);
 display:flex;flex-direction:column
}
.producto img{width:100%;border-radius:10px}
.precio{font-weight:bold;margin:6px 0}
.oferta del{color:red;margin-right:6px}

.acciones{margin-top:auto;display:flex;flex-direction:column;gap:8px}
select,button,input{padding:10px;border-radius:8px;border:1px solid #ccc}
.producto button{background:#1e4ddb;color:#fff;border:none;cursor:pointer}

#carritoBtn{
 position:fixed;bottom:20px;right:20px;
 background:#2ecc71;width:60px;height:60px;
 border-radius:50%;font-size:24px;border:none;cursor:pointer
}
#badge{
 position:absolute;top:-6px;right:-6px;background:red;color:#fff;
 width:22px;height:22px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:12px
}

#carrito{
 position:fixed;top:0;right:-100%;
 width:100%;max-width:420px;height:100%;
 background:#fff;transition:.3s;padding:20px;overflow:auto
}
#carrito.abierto{right:0}
.cerrar{float:right;font-size:22px;cursor:pointer}

.item{display:flex;justify-content:space-between;align-items:center}
.item button{background:none;border:none;color:red;font-size:14px;cursor:pointer}

.legal-links button{
 background:none;border:none;color:#1e4ddb;
 cursor:pointer;padding:0;margin-right:10px
}

#payment-success{
 display:none;position:fixed;inset:0;
 background:rgba(0,0,0,.6);z-index:9999;
 align-items:center;justify-content:center
}
#payment-success .box{
 background:#fff;padding:25px;border-radius:12px;
 max-width:420px;width:90%;text-align:center
}
</style>
</head>

<body>

<header>
 <h1>Store EGP</h1>
 <div class="subtitulo">Aquí encuentras lo que no sabías que buscabas</div>
 <small>@sstoreegp · sstoreegp@gmail.com</small>
</header>

<section class="productos" id="listaProductos"></section>

<button id="carritoBtn" onclick="abrirCarrito()">🛒<div id="badge" style="display:none">0</div></button>

<div id="carrito">
 <span class="cerrar" onclick="cerrarCarrito()">✖</span>
 <h2>Carrito</h2>
 <div id="items"></div>
 <p id="resumen"></p>

 <h3>Datos de envío</h3>
 <input id="email" placeholder="Correo electrónico">
 <input placeholder="Nombre completo">
 <input placeholder="Dirección">
 <input placeholder="Código Postal">
 <input placeholder="Ciudad">

 <p><b>Envío:</b> España peninsular — <b>0€ (prueba)</b></p>

 <div id="paypal-button-container" style="margin-top:15px"></div>

 <div class="legal-links" style="margin-top:20px">
   <button onclick="alert('Por motivos de precio actualmente solo es posible enviar en España peninsular. El producto llegará en unos 15 días desde la compra hecha.')">Envíos</button>
   <button onclick="alert('Devoluciones en 14 días si la prenda no ha sido usada ni lavada. El envío corre a cargo del comprador. Tras revisar el producto se hará el reembolso.')">Devoluciones</button>
 </div>
</div>

<!-- MENSAJE PAGO -->
<div id="payment-success">
 <div class="box">
  <h2>¡Pago realizado!</h2>
  <p>
   Hemos enviado un email con tu pedido y,
   cuando lo enviemos, te pasaremos el seguimiento.
   <br><br><b>Revisa Spam</b>
  </p>
  <button onclick="closeSuccess()">Aceptar</button>
 </div>
</div>

<script>
const productos=[
 {n:"Spiderman",p:1,img:"camiseta-spiderman.jpg",d:"Tu sentido arácnido lo sabe",oferta:"<span class='oferta'><del>15€</del> AHORA 1€</span>"},
 {n:"South Things",p:17,img:"camiseta-south-things.jpg",d:"Stranger Things x South Park"},
 {n:"Jhon Pork",p:12,img:"camiseta-pork.jpg",d:"Cógeme el teléfono"},
 {n:"Steve Harrington",p:10,img:"camiseta-steve.jpg",d:"Stranger Things vibes"},
 {n:"Dais Asco",p:15,img:"camiseta-asco.jpg",d:"Tremendo facto"},
 {n:"Drunk",p:14,img:"camiseta-drunk.jpg",d:"En verdad sí"},
 {n:"Alejense Gordas",p:14,img:"camiseta-clash.jpg",d:"TORRE INFERNAL"},
 {n:"Fortachón",p:10,img:"camiseta-fuerte.jpg",d:"Con estilo"},
 {n:"Rarete",p:18,img:"camiseta-raro.jpg",d:"Rarete things",oferta:"<span class='oferta'><del>25€</del> AHORA 18€</span>"},
 {n:"Pedrito",p:15,img:"camiseta-pedrito.jpg",d:"Vaya presi"},
 {n:"Llevo Razón",p:15,img:"camiseta-razon.jpg",d:"Siempre"},
 {n:"Ollita",p:13,img:"camiseta-olla.jpg",d:"jaja 😐"},
 {n:"(C)Rock",p:10,img:"camiseta-crock.jpg",d:"Rocoso"},
 {n:"Cervecita",p:12,img:"camiseta-cerveza.jpg",d:"Una más"},
 {n:"Kill humans",p:13,img:"camiseta-future.jpg",d:"La necesitas"}
];
const carrito=[];

function cargar(){
 const c=document.getElementById("listaProductos");
 productos.forEach(p=>{
  c.innerHTML+=`
  <div class="producto">
   <img src="${p.img}">
   <h3>${p.n}</h3>
   <p>${p.d}</p>
   <div class="precio">${p.p} €</div>
   <div class="acciones">
    <select><option>S</option><option>M</option><option>L</option></select>
    <button onclick="add('${p.n}',${p.p},this)">Añadir</button>
   </div>
  </div>`;
 });
}
cargar();

function add(n,p,btn){
 const t=btn.previousElementSibling.value;
 const item=carrito.find(i=>i.n===n&&i.t===t);
 if(item){item.q++}else{carrito.push({n,p,t,q:1})}
 abrirCarrito();actualizar();
}

function actualizar(){
 const div=document.getElementById("items");
 div.innerHTML="";let total=0;let count=0;
 carrito.forEach((i,idx)=>{
  total+=i.p*i.q;count+=i.q;
  div.innerHTML+=`
   <div class="item">
    <span>${i.n} (${i.t}) x${i.q} — ${i.p*i.q}€</span>
    <button onclick="quitar(${idx})">✖</button>
   </div>`;
 });
 document.getElementById("badge").style.display=count?"flex":"none";
 document.getElementById("badge").textContent=count;
 document.getElementById("resumen").innerHTML=`<b>Total: ${total}€</b>`;

 document.getElementById("paypal-button-container").innerHTML="";
 paypal.Buttons({
  createOrder:(d,a)=>a.order.create({
   purchase_units:[{amount:{value:total.toFixed(2)}}]
  }),
  onApprove:(d,a)=>a.order.capture().then(()=>{
   showSuccess();carrito.length=0;actualizar();
  })
 }).render("#paypal-button-container");
}

function quitar(i){carrito.splice(i,1);actualizar()}
function abrirCarrito(){document.getElementById("carrito").classList.add("abierto")}
function cerrarCarrito(){document.getElementById("carrito").classList.remove("abierto")}
function showSuccess(){document.getElementById("payment-success").style.display="flex"}
function closeSuccess(){document.getElementById("payment-success").style.display="none"}
</script>

</body>
</html>
